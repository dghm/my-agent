    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d13b48"/>
      <stop offset=".46" stop-color="#a9152a"/>
      <stop offset="1" stop-color="#790d20"/>
    </linearGradient>
    <linearGradient id="ribbonDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d1022"/>
      <stop offset="1" stop-color="#5e0918"/>
