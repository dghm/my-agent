    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b98420"/>
      <stop offset=".5" stop-color="#f2d477"/>
      <stop offset="1" stop-color="#c3922d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="150%" height="180%">
