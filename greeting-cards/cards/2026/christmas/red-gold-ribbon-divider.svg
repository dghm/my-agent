<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 132" role="img" aria-labelledby="title desc">
  <title id="title">紅金蝴蝶結彩帶</title>
  <desc id="desc">酒紅色緞帶配金色滾邊，右端繫有蝴蝶結。</desc>
