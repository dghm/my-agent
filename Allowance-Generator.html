<style>
  :root {
    --surface-tab-bg: #ffffff;
    --surface-tab-text: #475467;
  }
  :root[data-theme="dark"] {
    --surface-tab-bg: #2a313d;
    --surface-tab-text: #c4cbd6;
  }

  .allowance-page {
    display: flex;
    width: 100%;
    height: 100%;
    min-height: 0;
  }
  .allowance-editor-column {
    display: flex;
    flex: 0 0 520px;

    min-height: 0;

    background: var(--surface-panel-bg);

    border-bottom: 1px solid var(--surface-border);

    font-weight: 800;
    letter-spacing: .14em;

  .allowance-page-head h1 { margin: 0 0 5px; font-size: 24px; }
  .allowance-page-head .hint { margin: 0; font-size: 12px; line-height: 1.55; }

    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 20px;
    background: var(--surface-panel-bg);

    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 16px;
    flex-wrap: wrap;

    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    padding: 6px 10px;

  .draft-actions .draft-status {
    font-size: 12px;
    color: var(--surface-text-muted);
    white-space: nowrap;
  }
  .draft-actions #accordion-toggle-all {
    width: 32px;
    height: 32px;
    margin-left: auto;
    padding: 6px;
    justify-content: center;
  }
  #form > fieldset.form-section {
    overflow: hidden;
    padding: 0;
  }
  .form-section-header { width: 100%; }
  .form-section-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    padding: 11px 14px;
    border: 0;
    border-radius: 0;
    background: transparent;
    color: var(--navy-text);
    font-size: 12px;
    font-weight: 700;
    text-align: left;
  }
  .form-section-toggle:hover {
    background: color-mix(in srgb, var(--navy) 6%, var(--surface-panel-bg));
  }
  .form-section-toggle .section-chevron {
    transition: transform .18s ease;
  }
  .form-section.is-collapsed .section-chevron {
    transform: rotate(180deg);
  }
  .form-section-content {
    padding: 0 14px 12px;
  }
  .form-section.is-collapsed .form-section-content {
    display: none;
  }
  .blk {
    border: 1px solid var(--surface-border);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 10px;
    background: var(--surface-input-bg);
  }
  .blk-head {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-bottom: 8px;
  }
  .blk-head .blk-tag {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 700;
    color: var(--navy-text);
    background: var(--surface-tab-bg);

    border-radius: 4px;
    padding: 2px 6px;
  }
  .blk-head .spacer { flex: 1; }

    padding: 2px 4px;
  }
  .btn-del:hover { color: #e53935; }
  .row2, .row3 {
    display: grid;
    gap: 10px;
  }
  .row2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .row3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .hint {
    color: var(--surface-text-muted);
    font-size: 12px;
    line-height: 1.55;
  }
  textarea { min-height: 54px; }
  .items-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
    margin-bottom: 6px;
  }
  .items-table th {
    background: var(--navy);
    color: #fff;
    padding: 5px 6px;
    text-align: left;
    font-size: 0.68rem;
  }
  .items-table td {
    padding: 4px 4px;
    border-bottom: 1px solid var(--surface-border);
    vertical-align: middle;
  }
  .items-table td input, .items-table td textarea, .items-table td select {
    width: 100%;
    border: 1px solid var(--surface-input-border);
    border-radius: 4px;
    padding: 4px 6px;
    font-family: inherit;
    font-size: 12px;
    background: var(--surface-input-bg);
    color: var(--surface-text);
  }
  .items-table td textarea {
    resize: vertical;
    min-height: 30px;
    line-height: 1.4;
  }
  .items-table td.td-del {
    text-align: center;
    width: 26px;
  }
  .btn-add {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    background: none;
    border: 1px dashed var(--surface-input-border);
    color: var(--surface-text-muted);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  .btn-add:hover {
    border-color: var(--navy-text);
    color: var(--navy-text);
  }
  .totals-live {
    text-align: right;
    font-size: 12px;
    color: var(--surface-text-muted);
    margin-top: 6px;
  }
  .totals-live strong { color: var(--navy-text); }
  button.secondary { border-color: var(--surface-border); }
  button.secondary:hover { border-color: var(--navy-text); }
  .output-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px;
    overflow: hidden;
  }
  .output-toolbar {
    display: flex;
    justify-content: safe flex-end;
    gap: 8px;
    margin-bottom: 8px;
    overflow-x: auto;
    flex-wrap: nowrap;
    scrollbar-width: thin;
  }
  .tab-btn {
    display: inline-flex;
    align-items: center;
    flex-shrink: 0;
    gap: 7px;
    white-space: nowrap;
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid var(--surface-border);
    background: var(--surface-tab-bg);
    font-size: 13px;
    cursor: pointer;
    color: var(--surface-tab-text);
  }
  .tab-btn.active { background: var(--navy); color: #fff; border-color: var(--navy); }
  .output-toolbar button.secondary {
    display: inline-flex;
    align-items: center;
    flex-shrink: 0;
    gap: 7px;
    white-space: nowrap;
  }
  .output-toolbar .tab-btn,
  .output-toolbar button.secondary {
    justify-content: center;
    width: 34px;
    height: 32px;
    padding: 6px;
  }
  .action-icon {
    display: inline-block;
    flex: 0 0 16px;
    width: 16px;
    height: 16px;
    background: currentColor;
    -webkit-mask: var(--action-icon) center / contain no-repeat;
    mask: var(--action-icon) center / contain no-repeat;
  }
  svg.action-icon {
    background: none;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .copy-status {
    font-size: 12px;
    color: #1a7f4b;
    font-weight: 600;
  }
  .output-view {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .output-view.hidden { display: none; }
  #out-html {
    flex: 1;
    width: 100%;
    font-family: "SF Mono", Menlo, monospace;
    font-size: 12px;
    border: 1px solid var(--surface-input-border);
    border-radius: 8px;
    padding: 12px;
    resize: none;
    background: var(--surface-input-bg);
    color: var(--surface-text);
  }
  #preview-frame {
    flex: 1;
    width: 100%;
    border: 1px solid var(--surface-border);
    border-radius: 8px;
    background: #fff;
  }
</style>
</head>

  .seller-sample .cell.no-right {

  .seller-sample .cell.no-bottom {

  .seller-sample .cell.span-rows-3 {

  .seller-sample .cell.no-bottom-only {

  .seller-sample .col-1 { grid-column: 1; }
  .seller-sample .col-2 { grid-column: 2; }
  .seller-sample .col-3 { grid-column: 3; }
  .seller-sample .row-1 { grid-row: 1; }

<script>
initTheme('dghm-allowance-editor-theme');

var SESSION_STORAGE_KEY = 'dghm-allowance-session-draft';
var _suspendSessionSave = false;
var _sessionRestored = false;
var _isDirty = false;
var _uid = 0;

document.querySelectorAll('.tab-btn').forEach(function (btn) {
  btn.addEventListener('click', function () {
    document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
    document.querySelectorAll('.output-view').forEach(function (v) { v.classList.add('hidden'); });
    btn.classList.add('active');
    document.getElementById('view-' + btn.dataset.tab).classList.remove('hidden');
  });
});

function initFormAccordions() {
  var fieldsets = Array.from(document.querySelectorAll('#form > fieldset'));
  var toggleAll = document.getElementById('accordion-toggle-all');
  var collapseIcon = "url('https://cdn.jsdelivr.net/npm/lucide-static@0.552.0/icons/list-chevrons-down-up.svg')";
  var expandIcon = "url('https://cdn.jsdelivr.net/npm/lucide-static@0.552.0/icons/list-chevrons-up-down.svg')";

  function setSectionCollapsed(fieldset, collapsed) {
    var button = fieldset.querySelector('.form-section-toggle');
    var content = fieldset.querySelector('.form-section-content');
    fieldset.classList.toggle('is-collapsed', collapsed);
    button.setAttribute('aria-expanded', String(!collapsed));
    content.hidden = collapsed;
  }

  function updateToggleAll() {
    var anyExpanded = fieldsets.some(function (fieldset) {
      return !fieldset.classList.contains('is-collapsed');
    });
    var label = anyExpanded ? '全部收合' : '全部展開';
    var icon = toggleAll.querySelector('.action-icon');
    toggleAll.setAttribute('aria-label', label);
    toggleAll.title = label;
    icon.style.setProperty('--action-icon', anyExpanded ? collapseIcon : expandIcon);
  }

  fieldsets.forEach(function (fieldset, index) {
    var legend = fieldset.querySelector('legend');
    var label = legend.textContent.trim();
    var header = document.createElement('div');
    var content = document.createElement('div');
    var button = document.createElement('button');
    var title = document.createElement('span');
    var chevron = document.createElement('span');
    var contentId = 'form-section-' + (index + 1);

    fieldset.classList.add('form-section');
    header.className = 'form-section-header';
    content.className = 'form-section-content';
    content.id = contentId;
    while (legend.nextSibling) content.appendChild(legend.nextSibling);
    legend.remove();
    fieldset.appendChild(header);
    fieldset.appendChild(content);

    button.type = 'button';
    button.className = 'form-section-toggle';
    button.setAttribute('aria-expanded', 'true');
    button.setAttribute('aria-controls', contentId);
    title.textContent = label;
    chevron.className = 'action-icon section-chevron';
    chevron.setAttribute('aria-hidden', 'true');
    chevron.style.setProperty(
      '--action-icon',
      "url('https://cdn.jsdelivr.net/npm/lucide-static@0.552.0/icons/chevron-up.svg')"
    );
    button.appendChild(title);
    button.appendChild(chevron);
    header.appendChild(button);

    button.addEventListener('click', function () {
      var collapsed = !fieldset.classList.contains('is-collapsed');
      setSectionCollapsed(fieldset, collapsed);
      updateToggleAll();
    });
  });

  toggleAll.addEventListener('click', function () {
    var shouldCollapse = fieldsets.some(function (fieldset) {
      return !fieldset.classList.contains('is-collapsed');
    });
    fieldsets.forEach(function (fieldset) {
      setSectionCollapsed(fieldset, shouldCollapse);
    });
    updateToggleAll();
  });

  updateToggleAll();
}

function uid(prefix) { _uid += 1; return prefix + _uid; }
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function xmlEsc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function v(id) { return (document.getElementById(id) || {}).value || ''; }
function fmtMoney(n) {
  return Math.round(n || 0).toLocaleString('zh-TW');
}
function numberValue(value) {
  if (value === '' || value == null) return 0;
  var clean = String(value).replace(/,/g, '').trim();
  var n = parseFloat(clean);
  return isNaN(n) ? 0 : n;
}
function rocDateParts(dateStr) {
  if (!dateStr) return { rocYear: '', month: '', day: '' };
  var parts = dateStr.split('-');
  if (parts.length !== 3) return { rocYear: '', month: '', day: '' };
  return {
    rocYear: String(parseInt(parts[0], 10) - 1911),
    month: String(parseInt(parts[1], 10)),
    day: String(parseInt(parts[2], 10))
  };
}
function localDateInputValue() {
  var now = new Date();
  var year = now.getFullYear();
  var month = String(now.getMonth() + 1).padStart(2, '0');
  var day = String(now.getDate()).padStart(2, '0');
  return year + '-' + month + '-' + day;
}
function tick(flag) { return flag ? '✓' : ''; }
function fileSafeText(value, fallback) {
  var text = String(value || '').trim() || fallback;
  return text.replace(/[\\/:*?"<>|]/g, '-');
}

function addItemRow(data) {
  data = data || {};
  var id = uid('item');
  var wrap = document.createElement('div');
  wrap.className = 'blk';
  wrap.id = id;
  wrap.dataset.kind = 'item';
  wrap.innerHTML =
    '<div class="blk-head">' +
      '<span class="blk-tag">明細列</span>' +
      '<span class="spacer"></span>' +
      '<button type="button" class="btn-del" onclick="removeBlk(\'' + id + '\')">✕</button>' +
    '</div>' +
    '<div class="row3">' +
      '<div><label>發票日期</label><input type="date" class="i-date" value="' + esc(data.invoiceDate || '') + '"></div>' +
      '<div><label>聯式</label><input type="text" class="i-style" value="' + esc(data.invoiceStyle || '') + '" placeholder="例：二聯式"></div>' +
      '<div><label>字軌</label><input type="text" class="i-prefix" value="' + esc(data.prefix || '') + '"></div>' +
    '</div>' +
    '<div class="row2">' +
      '<div><label>發票號碼</label><input type="text" class="i-number" value="' + esc(data.invoiceNumber || '') + '"></div>' +
      '<div><label>品名</label><input type="text" class="i-name" value="' + esc(data.itemName || '') + '"></div>' +
    '</div>' +
    '<div class="row3">' +
      '<div><label>數量</label><input type="number" min="0" step="0.001" class="i-qty" value="' + esc(data.qty || '') + '"></div>' +
      '<div><label>單價</label><input type="number" min="0" step="0.01" class="i-unit" value="' + esc(data.unitPrice || '') + '"></div>' +
      '<div><label>不含稅金額</label><input type="number" min="0" step="1" class="i-amount" value="' + esc(data.amount || '') + '"></div>' +
    '</div>' +
    '<div class="row2">' +
      '<div><label>營業稅額</label><input type="number" min="0" step="1" class="i-tax" value="' + esc(data.tax || '') + '"></div>' +
      '<div><label>課稅別</label>' +
        '<select class="i-tax-type">' +
          '<option value="taxable">應稅</option>' +
          '<option value="zero">零稅率</option>' +
          '<option value="exempt">免稅</option>' +
        '</select>' +
      '</div>' +
    '</div>';
  document.getElementById('item-list').appendChild(wrap);
  wrap.querySelector('.i-tax-type').value = data.taxType || 'taxable';
  wrap.querySelectorAll('input, select').forEach(function (el) {
    el.addEventListener('input', refreshOutput);
    el.addEventListener('change', refreshOutput);
  });
  refreshOutput();
}

function removeBlk(id) {
  var el = document.getElementById(id);
  if (el) el.remove();
  refreshOutput();
}

function collectItems() {
  var items = [];
  document.querySelectorAll('#item-list .blk').forEach(function (wrap) {
    items.push({
      invoiceDate: wrap.querySelector('.i-date').value,
      invoiceStyle: wrap.querySelector('.i-style').value,
      prefix: wrap.querySelector('.i-prefix').value,
      invoiceNumber: wrap.querySelector('.i-number').value,
      itemName: wrap.querySelector('.i-name').value,
      qty: wrap.querySelector('.i-qty').value,
      unitPrice: wrap.querySelector('.i-unit').value,
      amount: wrap.querySelector('.i-amount').value,
      tax: wrap.querySelector('.i-tax').value,
      taxType: wrap.querySelector('.i-tax-type').value
    });
  });
  return items;
}

function buildRowsHtml(items) {
  var rows = '';
  for (var i = 0; i < Math.max(items.length, 5); i += 1) {
    var item = items[i] || {};
    var dateParts = rocDateParts(item.invoiceDate || '');
    rows += '<tr class="data-row">' +
      '<td>' + xmlEsc(item.invoiceStyle || '') + '</td>' +
      '<td>' + xmlEsc(dateParts.rocYear || '') + '</td>' +
      '<td>' + xmlEsc(dateParts.month || '') + '</td>' +
      '<td>' + xmlEsc(dateParts.day || '') + '</td>' +
      '<td>' + xmlEsc(item.prefix || '') + '</td>' +
      '<td>' + xmlEsc(item.invoiceNumber || '') + '</td>' +
      '<td class="align-left">' + xmlEsc(item.itemName || '') + '</td>' +
      '<td class="align-right">' + xmlEsc(item.qty || '') + '</td>' +
      '<td class="align-right">' + (item.unitPrice ? fmtMoney(numberValue(item.unitPrice)) : '') + '</td>' +
      '<td class="align-right">' + (item.amount ? fmtMoney(numberValue(item.amount)) : '') + '</td>' +
      '<td class="align-right">' + (item.tax ? fmtMoney(numberValue(item.tax)) : '') + '</td>' +
      '<td class="check">' + tick(item.taxType === 'taxable') + '</td>' +
      '<td class="check">' + tick(item.taxType === 'zero') + '</td>' +
      '<td class="check">' + tick(item.taxType === 'exempt') + '</td>' +
    '</tr>';
  }
  return rows;
}

function buildDoc() {
  var tpl = document.getElementById('allowanceTpl').textContent;
  var docDate = rocDateParts(v('f_doc_date'));
  var items = collectItems().filter(function (item) {
    return item.invoiceDate || item.invoiceStyle || item.prefix || item.invoiceNumber || item.itemName || item.qty || item.unitPrice || item.amount || item.tax;
  });
  var amountTotal = 0;
  var taxTotal = 0;
  var taxableCount = 0;
  var zeroCount = 0;
  var exemptCount = 0;
  items.forEach(function (item) {
    amountTotal += numberValue(item.amount);
    taxTotal += numberValue(item.tax);
    if (item.taxType === 'zero') zeroCount += 1;
    else if (item.taxType === 'exempt') exemptCount += 1;
    else taxableCount += 1;
  });

  var replacements = {
    '{sellerName}': xmlEsc(v('f_seller_name')),
    '{sellerVat}': xmlEsc(v('f_seller_vat')),
    '{sellerAddress}': xmlEsc(v('f_seller_address')),
    '{rocYear}': xmlEsc(docDate.rocYear),
    '{month}': xmlEsc(docDate.month),
    '{day}': xmlEsc(docDate.day),
    '{copyNote}': xmlEsc(v('f_copy_note') || '第一聯：交付原銷貨人'),
    '{rowsHtml}': buildRowsHtml(items),
    '{totalAmount}': amountTotal ? fmtMoney(amountTotal) : '',
    '{totalTax}': taxTotal ? fmtMoney(taxTotal) : '',
    '{totalTaxable}': '',
    '{totalZero}': '',
    '{totalExempt}': '',
    '{buyerName}': xmlEsc(v('f_buyer_name')),
    '{buyerVat}': xmlEsc(v('f_buyer_vat')),
    '{county}': xmlEsc(v('f_addr_county')),
    '{district}': xmlEsc(v('f_addr_district')),
    '{village}': xmlEsc(v('f_addr_village')),
    '{street}': xmlEsc(v('f_addr_street')),
    '{section}': xmlEsc(v('f_addr_section')),
    '{lane}': xmlEsc(v('f_addr_lane')),
    '{alley}': xmlEsc(v('f_addr_alley')),
    '{number}': xmlEsc(v('f_addr_number')),
    '{floor}': xmlEsc(v('f_addr_floor')),
    '{room}': xmlEsc(v('f_addr_room'))
  };

  Object.keys(replacements).forEach(function (key) {
    tpl = tpl.split(key).join(replacements[key]);
  });

  var totalsLive = document.getElementById('totals-live');
  totalsLive.innerHTML = '不含稅合計 <strong>' + (amountTotal ? fmtMoney(amountTotal) : '0') + '</strong>　營業稅額 <strong>' + (taxTotal ? fmtMoney(taxTotal) : '0') + '</strong>';
  return tpl;
}

function refreshOutput() {
  var html = buildDoc();
  document.getElementById('preview-frame').srcdoc = html;
  document.getElementById('out-html').value = html;
  persistSessionDraft();
}

function previewDoc() {
  var html = buildDoc();
  var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  window.open(URL.createObjectURL(blob), '_blank');
}

function generateDoc() {
  var html = buildDoc();
  var filename = fileSafeText(v('f_doc_no'), 'allowance') + '-折讓單.html';
  var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

document.getElementById('open-btn').addEventListener('click', previewDoc);
document.getElementById('download-btn').addEventListener('click', generateDoc);
document.getElementById('copy-btn').addEventListener('click', function () {
  var status = document.getElementById('copy-status');
  navigator.clipboard.writeText(document.getElementById('out-html').value).then(function () {
    status.textContent = '已複製！';
    setTimeout(function () { status.textContent = ''; }, 1500);
  }, function () {
    status.textContent = '複製失敗，請手動選取後複製';
    setTimeout(function () { status.textContent = ''; }, 2000);
  });
});

document.querySelector('.form-panel').addEventListener('input', function () {
  _isDirty = true;
});
window.addEventListener('beforeunload', function (e) {
  if (!_isDirty) return;
  e.preventDefault();
  e.returnValue = '';
});

var FIELD_IDS = [
  'f_doc_date', 'f_copy_note', 'f_doc_no',
  'f_seller_name', 'f_seller_vat', 'f_seller_address',
  'f_buyer_name', 'f_buyer_vat',
  'f_addr_county', 'f_addr_district', 'f_addr_village',
  'f_addr_street', 'f_addr_section', 'f_addr_lane',
  'f_addr_alley', 'f_addr_number', 'f_addr_floor', 'f_addr_room'
];

function collectDraft() {
  var draft = { kind: 'dghm-allowance-draft', version: 1, fields: {}, items: [] };
  FIELD_IDS.forEach(function (id) { draft.fields[id] = v(id); });
  draft.items = collectItems();
  return draft;
}

function setDraftStatus(message) {
  document.getElementById('draft-status').textContent = message || '';
}

function sessionTimeLabel() {
  return new Date().toLocaleTimeString('zh-TW', {
    hour: '2-digit',
    minute: '2-digit'
  });
}

function persistSessionDraft() {
  if (_suspendSessionSave) return;
  try {
    localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(collectDraft()));
    setDraftStatus('已自動暫存 ' + sessionTimeLabel());
  } catch (err) {
    setDraftStatus('本機暫存失敗');
  }
}

function clearSessionDraft(showMessage) {
  localStorage.removeItem(SESSION_STORAGE_KEY);
  if (showMessage) setDraftStatus('已清除本機暫存');
}

function applyDraft(draft) {
  _suspendSessionSave = true;
  FIELD_IDS.forEach(function (id) {
    if (draft.fields && id in draft.fields) {
      var el = document.getElementById(id);
      if (el) el.value = draft.fields[id];
    }
  });
  document.getElementById('item-list').innerHTML = '';
  (draft.items && draft.items.length ? draft.items : [{}]).forEach(function (item) {
    addItemRow(item);
  });
  _suspendSessionSave = false;
  refreshOutput();
}

function restoreSessionDraft() {
  var raw = localStorage.getItem(SESSION_STORAGE_KEY);
  if (!raw) return false;
  try {
    applyDraft(JSON.parse(raw));
    _sessionRestored = true;
    setDraftStatus('已恢復上次工作 session');
    return true;
  } catch (err) {
    clearSessionDraft(false);
    setDraftStatus('上次暫存損毀，已略過');
    return false;
  }
}

document.getElementById('save-draft-btn').addEventListener('click', function () {
  var draft = collectDraft();
  var blob = new Blob([JSON.stringify(draft, null, 2)], { type: 'application/json;charset=utf-8' });
  var name = fileSafeText(v('f_doc_no'), 'allowance');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name + '-草稿.json';
  a.click();
});

document.getElementById('load-draft-btn').addEventListener('click', function () {
  document.getElementById('load-draft-input').click();
});

document.getElementById('clear-session-btn').addEventListener('click', function () {
  clearSessionDraft(true);
});

document.getElementById('load-draft-input').addEventListener('change', function (e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () {
    try {
      var draft = JSON.parse(reader.result);
      applyDraft(draft);
      persistSessionDraft();
      setDraftStatus('已載入草稿 JSON，並更新本機暫存');
    } catch (err) {
      alert('草稿檔案格式錯誤，無法載入。');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

document.querySelectorAll('#form input, #form textarea, #form select').forEach(function (el) {
  el.addEventListener('input', refreshOutput);
  el.addEventListener('change', refreshOutput);
});

_suspendSessionSave = true;
document.getElementById('f_doc_date').value = localDateInputValue();
addItemRow({
  taxType: 'taxable'
});
addItemRow({
  taxType: 'taxable'
});
refreshOutput();
initFormAccordions();
if (!restoreSessionDraft()) _suspendSessionSave = false;
if (!_sessionRestored) {
  _suspendSessionSave = false;
  persistSessionDraft();
}
</script>
</body>
</html>
