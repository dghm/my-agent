<html lang="zh-Hant">
<head>

<title>DGHM 合約文件產生器</title>

<link rel="stylesheet" href="app-shell.css?v=20260729-1">
<style>
  /* ---- Tool-specific tokens (tab surface) ---- */
  :root {
    --surface-tab-bg:   #ffffff;
    --surface-tab-text: #475467;
  }
  :root[data-theme="dark"] {
    --surface-tab-bg:   #2a313d;
    --surface-tab-text: #c4cbd6;
  }

  /* ---- Tool-specific layout ---- */
  .quote-page {
    display: flex;
    width: 100%;
    height: 100%;
    min-height: 0;
  }
  .quote-editor-column {
    display: flex;
    flex: 0 0 500px;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    border-right: 1px solid var(--surface-border);
    background: var(--surface-panel-bg);
  }
  .quote-page-head {
    flex-shrink: 0;
    padding: 22px 20px 18px;
    border-bottom: 1px solid var(--surface-border);
    background: var(--surface-bg);
  }
  .quote-eyebrow {
    margin: 0 0 5px;
    color: var(--orange);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .14em;
  }
  .quote-page-head h1 { margin: 0 0 5px; font-size: 24px; }
  .quote-page-head .hint { margin: 0; font-size: 12px; line-height: 1.55; }
  .form-panel {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 20px;
    background: var(--surface-panel-bg);
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .draft-actions { display: flex; align-items: center; gap: 8px; margin: 0 0 16px; flex-wrap: wrap; }
  .draft-actions button {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    padding: 6px 10px;
  }
  .draft-actions .draft-status {
    font-size: 12px;
    color: var(--surface-text-muted);
    white-space: nowrap;
  }
  .draft-actions #accordion-toggle-all {
    width: 32px;
    height: 32px;
    margin-left: auto;
    padding: 6px;
    justify-content: center;
  }
  .home-link { display: inline-block; margin-bottom: 8px; }
  textarea { min-height: 54px; }
  button { padding: 6px 12px; font-size: 12px; }

  /* ---- Form section accordions ---- */
  #form > fieldset.form-section {
    overflow: hidden;
    padding: 0;
  }
  .form-section-header { width: 100%; }
  .form-section-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    padding: 11px 14px;
    border: 0;
    border-radius: 0;
    background: transparent;
    color: var(--navy-text);
    font-size: 12px;
    font-weight: 700;
    text-align: left;
  }
  .form-section-toggle:hover {
    background: color-mix(in srgb, var(--navy) 6%, var(--surface-panel-bg));
  }
  .form-section-toggle .section-chevron {
    transition: transform .18s ease;
  }
  .form-section.is-collapsed .section-chevron {
    transform: rotate(180deg);
  }
  .form-section-content {
    padding: 0 14px 12px;
  }
  .form-section.is-collapsed .form-section-content {
    display: none;
  }

  /* ---- Dynamic block cards (form side) ---- */
  .blk {
    border: 1px solid var(--surface-border);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 10px;
    background: var(--surface-input-bg);
  }
  .blk-head { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .blk-head .blk-tag {
    flex-shrink: 0; font-size: 11px; font-weight: 700; color: var(--navy-text);
    background: var(--surface-tab-bg); border: 1px solid var(--surface-border);
    border-radius: 4px; padding: 2px 6px;
  }
  .blk-head .spacer { flex: 1; }
  .page-pick { display: flex; align-items: center; gap: 4px; flex-shrink: 0; font-size: 11px; color: var(--surface-text-muted); }
  .page-pick input { width: 44px; text-align: center; padding: 3px 4px; font-size: 12px; }
  .btn-del { background: none; border: none; color: #ccc; cursor: pointer; font-size: 1rem; padding: 2px 4px; }
  .btn-del:hover { color: #e53935; }

  /* ---- Rows table (form side) ---- */
  .items-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin-bottom: 6px; }
  .items-table th { background: var(--navy); color: #fff; padding: 5px 6px; text-align: left; font-size: 0.68rem; }
  .items-table td { padding: 4px 4px; border-bottom: 1px solid var(--surface-border); vertical-align: middle; }
  .items-table td input, .items-table td textarea {
    width: 100%; border: 1px solid var(--surface-input-border); border-radius: 4px;
    padding: 4px 6px; font-family: inherit; font-size: 12px;
    background: var(--surface-input-bg); color: var(--surface-text);
  }
  .items-table td textarea { resize: vertical; min-height: 30px; line-height: 1.4; }
  .items-table td.td-del { text-align: center; width: 26px; }
  .btn-add {
    display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%;
    background: none; border: 1px dashed var(--surface-input-border); color: var(--surface-text-muted);
    border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer;
  }
  .btn-add:hover { border-color: var(--navy-text); color: var(--navy-text); }
  .btn-add.sm { width: auto; padding: 4px 10px; }
  .blk label { font-size: 11px; margin-top: 6px; }
  .totals-live { text-align: right; font-size: 12px; color: var(--surface-text-muted); margin-top: 2px; }
  .totals-live strong { color: var(--navy-text); }

  /* ---- Button overrides ---- */
  button.secondary { border-color: var(--surface-border); }
  button.secondary:hover { border-color: var(--navy-text); }

  /* ---- Output panel ---- */
  .output-panel { flex: 1; display: flex; flex-direction: column; padding: 20px; overflow: hidden; }
  .output-toolbar {
    display: flex;
    justify-content: safe flex-end;
    gap: 8px;
    margin-bottom: 8px;
    overflow-x: auto;
    flex-wrap: nowrap;
    scrollbar-width: thin;
  }
  .tab-btn {
    display: inline-flex;
    align-items: center;
    flex-shrink: 0;
    gap: 7px;
    white-space: nowrap;
    padding: 6px 14px; border-radius: 6px; border: 1px solid var(--surface-border);
    background: var(--surface-tab-bg); font-size: 13px; cursor: pointer; color: var(--surface-tab-text);
  }
  .tab-btn.active { background: var(--navy); color: #fff; border-color: var(--navy); }
  .output-toolbar button.secondary {
    display: inline-flex;
    align-items: center;
    flex-shrink: 0;
    gap: 7px;
    white-space: nowrap;
  }
  .output-toolbar .tab-btn,
  .output-toolbar button.secondary {
    justify-content: center;
    width: 34px;
    height: 32px;
    padding: 6px;
  }
  .output-toolbar .copy-status { flex-shrink: 0; }
  .action-icon {
    display: inline-block;
    flex: 0 0 16px;
    width: 16px;
    height: 16px;
    background: currentColor;
    -webkit-mask: var(--action-icon) center / contain no-repeat;
    mask: var(--action-icon) center / contain no-repeat;
  }
  svg.action-icon {
    background: none;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .copy-status { font-size: 12px; color: #1a7f4b; font-weight: 600; }
  .output-view { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .output-view.hidden { display: none; }
  #out-html {
    flex: 1; width: 100%; font-family: "SF Mono", Menlo, monospace; font-size: 12px;
    border: 1px solid var(--surface-input-border); border-radius: 8px; padding: 12px; resize: none;
    background: var(--surface-input-bg); color: var(--surface-text);
  }
  #preview-frame { flex: 1; width: 100%; border: 1px solid var(--surface-border); border-radius: 8px; background: #fff; }
</style>
</head>

  .banner-label { position: absolute; right: 6%; top: 72%; transform: translateY(-50%); color: #fff; font-weight: 400; font-size: 1.6rem; letter-spacing: 2px; white-space: nowrap; }
  .doc-header-body { background: white; color: var(--navy); padding: 7mm 14mm 8mm; position: relative; }
  .doc-header-body h1 { font-size: 1.6rem; font-weight: 700; line-height: 1.25; margin-bottom: 4px; }
  .doc-header-body .subtitle { font-size: 0.85rem; opacity: 0.7; }
  .header-meta { position: absolute; top: 7mm; right: 14mm; font-size: 0.78rem; line-height: 1.8; color: var(--navy); }
  .meta-item .label { color: var(--gray); font-weight: 400; }
  .meta-item .value { font-weight: 600; color: var(--navy); }
  .parties { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 14mm 6mm; }
  .party-box .role { width: fit-content; font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; color: var(--orange); font-weight: 700; margin-bottom: 6px; padding-bottom: 4px; border-bottom: 2px solid var(--orange); display: inline-block; }
  .party-box .company { font-size: 1rem; font-weight: 700; color: var(--navy); margin-bottom: 2px; }
  .party-box .brand { font-size: 0.78rem; color: var(--gray); margin-bottom: 3px; }
  .party-box .detail { font-size: 0.78rem; color: var(--gray); line-height: 1.7; }
  .section { padding: 2mm 14mm 4mm; }
  .section-title { font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; color: var(--orange); font-weight: 700; margin-bottom: 6px; padding-bottom: 4px; border-bottom: 2px solid var(--orange); display: inline-block; }
  .cat-header { display: flex; align-items: baseline; gap: 10px; padding: 5mm 14mm 2mm; }
  .cat-header-title { font-size: 0.9rem; font-weight: 700; letter-spacing: 2px; color: var(--orange); padding-bottom: 4px; border-bottom: 2px solid var(--orange); white-space: nowrap; }
  .cat-header-desc { font-size: 0.75rem; color: var(--gray); line-height: 1.4; }
  .feat-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin-bottom: 2mm; }
  .feat-table thead tr { background: var(--navy); color: #fff; }
  .feat-table thead th { padding: 5px 10px; text-align: left; font-weight: 600; font-size: 0.75rem; }
  .feat-table tbody tr:nth-child(even) { background: var(--bg); }
  .feat-table td { padding: 5px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; text-align: left; }
  .feat-table td.item-name { font-weight: 600; color: var(--navy); width: 22%; }
  .feat-table td.spec { color: var(--gray); font-size: 0.78rem; width: 23%; }
  .feat-table td.desc { color: var(--ink); font-size: 0.78rem; }
  .opt-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin-bottom: 2mm; }
  .opt-table thead tr { background: var(--navy-light); color: #fff; }
  .opt-table thead th { padding: 5px 10px; text-align: left; font-weight: 600; font-size: 0.75rem; }
  .opt-table tbody tr:nth-child(even) { background: var(--bg); }
  .opt-table td { padding: 6px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; text-align: left; }
  .opt-table td.item-name { font-weight: 600; color: var(--navy); width: 26%; }
  .opt-table td.desc { color: var(--ink); font-size: 0.78rem; }
  .opt-table td.price { text-align: right; font-weight: 600; color: var(--navy); white-space: nowrap; width: 18%; }
  .opt-table td.chk { text-align: center; width: 8%; font-size: 1rem; }
  .totals-wrap { display: flex; justify-content: flex-end; margin-top: 3px; padding: 0 14mm; }
  .totals-table { width: 62%; border-collapse: collapse; font-size: 0.85rem; }
  .totals-table td { padding: 5px 10px; }
  .totals-table td:last-child { text-align: right; font-weight: 600; }
  .totals-table .tax-row td { color: var(--gray); font-size: 0.8rem; }
  .totals-table .total-row td { background: var(--navy); color: #fff; font-weight: 700; padding: 6px 10px; }
  .totals-table .total-row td:last-child { font-size: 1.3rem; }
  .payment-grid { display: grid; gap: 8px; margin-top: 6px; }
  .payment-card { border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; }
  .payment-card .phase { font-size: 0.7rem; color: var(--orange); font-weight: 700; letter-spacing: 1px; margin-bottom: 2px; text-transform: uppercase; }
  .payment-card .amount { font-size: 1rem; font-weight: 700; color: var(--navy); margin-bottom: 2px; }
  .payment-card .timing { font-size: 0.72rem; color: var(--gray); line-height: 1.4; }
  .schedule-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin-top: 6px; }
  .schedule-table th { background: var(--navy); color: #fff; padding: 6px 10px; text-align: left; font-size: 0.75rem; font-weight: 600; }
  .schedule-table td { padding: 6px 10px; border-bottom: 1px solid var(--border); }
  .schedule-table tr:nth-child(even) td { background: var(--bg); }
  .schedule-table .week { font-weight: 600; color: var(--navy); white-space: nowrap; }
  .schedule-table tbody tr.total-row td { background: var(--navy) !important; color: #fff !important; font-weight: 700; }
  .terms-box { background: var(--bg); border-radius: 0 6px 6px 0; padding: 8px 14px; font-size: 0.78rem; color: var(--gray); line-height: 1.6; margin-top: 6px; border-left: 3px solid var(--navy); }
  .exclusion-list {
    margin-top: 6px;
    font-size: 0.8rem;
    color: var(--gray);
    column-count: 2;
    column-gap: 20px;
  }
  .exclusion-list li {
    list-style: none;
    padding-left: 14px;
    position: relative;
    break-inside: avoid;
    -webkit-column-break-inside: avoid;
    margin: 0 0 3px;
  }
  .exclusion-list li::before { content: '—'; position: absolute; left: 0; color: var(--border); }
  .client-list { margin-top: 6px; display: flex; flex-direction: column; gap: 3px; font-size: 0.82rem; }
  .client-list li { list-style: none; padding-left: 16px; position: relative; color: var(--ink); }
  .client-list li::before { content: '✓'; position: absolute; left: 0; color: var(--orange); font-weight: 700; font-size: 0.8rem; }

/* ============================================================

document.querySelectorAll('.tab-btn').forEach(function (btn) {

/* ============================================================
   表單分區手風琴
   ============================================================ */
function initFormAccordions() {
  var fieldsets = Array.from(document.querySelectorAll('#form > fieldset'));
  var toggleAll = document.getElementById('accordion-toggle-all');
  var collapseIcon = "url('https://cdn.jsdelivr.net/npm/lucide-static@0.552.0/icons/list-chevrons-down-up.svg')";
  var expandIcon = "url('https://cdn.jsdelivr.net/npm/lucide-static@0.552.0/icons/list-chevrons-up-down.svg')";

  function setSectionCollapsed(fieldset, collapsed) {
    var button = fieldset.querySelector('.form-section-toggle');
    var content = fieldset.querySelector('.form-section-content');
    fieldset.classList.toggle('is-collapsed', collapsed);
    button.setAttribute('aria-expanded', String(!collapsed));
    content.hidden = collapsed;
  }

  function updateToggleAll() {
    var anyExpanded = fieldsets.some(function (fieldset) {
      return !fieldset.classList.contains('is-collapsed');
    });
    var label = anyExpanded ? '全部收合' : '全部展開';
    var icon = toggleAll.querySelector('.action-icon');
    toggleAll.setAttribute('aria-label', label);
    toggleAll.title = label;
    icon.style.setProperty('--action-icon', anyExpanded ? collapseIcon : expandIcon);
  }

  fieldsets.forEach(function (fieldset, index) {
    var legend = fieldset.querySelector('legend');
    var label = legend.textContent.trim();
    var header = document.createElement('div');
    var content = document.createElement('div');
    var button = document.createElement('button');
    var title = document.createElement('span');
    var chevron = document.createElement('span');
    var contentId = 'form-section-' + (index + 1);

    fieldset.classList.add('form-section');
    header.className = 'form-section-header';
    content.className = 'form-section-content';
    content.id = contentId;
    while (legend.nextSibling) content.appendChild(legend.nextSibling);
    legend.remove();
    fieldset.appendChild(header);
    fieldset.appendChild(content);

    button.type = 'button';
    button.className = 'form-section-toggle';
    button.setAttribute('aria-expanded', 'true');
    button.setAttribute('aria-controls', contentId);
    title.textContent = label;
    chevron.className = 'action-icon section-chevron';
    chevron.setAttribute('aria-hidden', 'true');
    chevron.style.setProperty(
      '--action-icon',
      "url('https://cdn.jsdelivr.net/npm/lucide-static@0.552.0/icons/chevron-up.svg')"
    );
    button.appendChild(title);
    button.appendChild(chevron);
    header.appendChild(button);

    button.addEventListener('click', function () {
      var collapsed = !fieldset.classList.contains('is-collapsed');
      setSectionCollapsed(fieldset, collapsed);
      updateToggleAll();
    });
  });

  toggleAll.addEventListener('click', function () {
    var shouldCollapse = fieldsets.some(function (fieldset) {
      return !fieldset.classList.contains('is-collapsed');
    });
    fieldsets.forEach(function (fieldset) {
      setSectionCollapsed(fieldset, shouldCollapse);
    });
    updateToggleAll();
  });

  updateToggleAll();
}

/* ============================================================
   共用工具
   ============================================================ */
var _uid = 0;
function uid(prefix) { _uid++; return prefix + _uid; }

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function xmlEsc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function nl2br(s) { return xmlEsc(s).replace(/\n/g, '<br>'); }
function v(id) { return (document.getElementById(id)||{}).value||''; }
function fmtNT(n) { return 'NT$ ' + Math.round(n).toLocaleString('zh-TW'); }
function fmtDateZh(s) {
  if (!s) return '';
  var p = s.split('-');
  if (p.length !== 3) return s;
  return parseInt(p[0],10) + ' 年 ' + parseInt(p[1],10) + ' 月 ' + parseInt(p[2],10) + ' 日';
}
function pageOf(el) {
  var n = parseInt(el.value, 10);
  return (isNaN(n) || n < 1) ? 1 : n;
}
function lines(s) {
  return String(s||'').split('\n').map(function (t) { return t.trim(); }).filter(Boolean);
}

function addArticle(data) {

    '<label>條文內容（段落、- 條列、1. 編號）</label>' +

  refreshOutput();

function removeBlk(id) {

function inlineMarkdown(text) {
  return xmlEsc(text)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/__(.+?)__/g, '<strong>$1</strong>');
}

function parseBodyText(text) {
  var rawLines = String(text || '').replace(/\r/g, '').split('\n');
  var blocks = [];
  var paragraph = [];

  function flushParagraph() {
    if (!paragraph.length) return;
    blocks.push({ type: 'p', text: paragraph.join(' ') });
    paragraph = [];
  }

  rawLines.forEach(function (raw) {
    var line = raw.trim();
    if (!line) { flushParagraph(); return; }
    if (/^\d+\.\s+/.test(line)) {
      flushParagraph();
      if (!blocks.length || blocks[blocks.length - 1].type !== 'ol') blocks.push({ type: 'ol', items: [] });
      blocks[blocks.length - 1].items.push(line.replace(/^\d+\.\s+/, '').trim());
      return;
    }
    if (/^[\-\*]\s+/.test(line)) {
      flushParagraph();
      if (!blocks.length || blocks[blocks.length - 1].type !== 'ul') blocks.push({ type: 'ul', items: [] });
      blocks[blocks.length - 1].items.push(line.replace(/^[\-\*]\s+/, '').trim());
      return;
    }
    if (blocks.length && (blocks[blocks.length - 1].type === 'ol' || blocks[blocks.length - 1].type === 'ul')) {
      blocks.push({ type: 'p', text: line });
      return;
    }
    paragraph.push(line);
  });
  flushParagraph();
  return blocks;
}

function renderBlocks(blocks) {
  return blocks.map(function (block) {
    if (block.type === 'p') return '<p>' + inlineMarkdown(block.text) + '</p>';
    if (block.type === 'ol') return '<ol>' + block.items.map(function (item) { return '<li>' + inlineMarkdown(item) + '</li>'; }).join('') + '</ol>';
    return '<ul>' + block.items.map(function (item) { return '<li>' + inlineMarkdown(item) + '</li>'; }).join('') + '</ul>';
  }).join('\n');
}

function buildArticleHtml(wrap) {
  var title = wrap.querySelector('.a-title').value.trim();
  var body = wrap.querySelector('.a-body').value;
  if (!title && !body.trim()) return '';
  return '<div class="article"><div class="article-title">' + xmlEsc(title || '未命名條文') + '</div><div class="article-body">' +
    renderBlocks(parseBodyText(body)) + '</div></div>\n';
}

    '<div class="sig-box"><div class="sig-label">' + xmlEsc(v('f_party_a_role') || '甲方') + '</div><div class="sig-company">' + xmlEsc(companyA) + '</div><div class="sig-brand">&nbsp;</div><div class="sig-line"></div><div class="sig-field">授權代表簽名 &nbsp;｜&nbsp; 日期：&emsp;&emsp;&emsp;&emsp;&emsp;</div></div>\n' +
    '<div class="sig-box"><div class="sig-label">' + xmlEsc(v('f_party_b_role') || '乙方') + '</div><div class="sig-company">' + xmlEsc(companyB) + '</div><div class="sig-brand">&nbsp;</div><div class="sig-line"></div><div class="sig-field">授權代表簽名 &nbsp;｜&nbsp; 日期：&emsp;&emsp;&emsp;&emsp;&emsp;</div></div>\n' +
    '</div>\n</div>\n';
  return html;
}

function buildValidityHtml() {

}

function buildDoc() {
  var ctNo = v('f_ct_no').trim() || 'DH-CT-001';
  var companyA = v('f_party_a_company').trim();
  var companyB = v('f_party_b_company').trim() || '萬能數維有限公司';
  var titleLines = lines(v('f_doc_title'));
  var titleHtml = titleLines.map(xmlEsc).join('<br>') || '服務合約書';
  var titlePlain = titleLines.join(' ') || '服務合約書';
  var bannerLabel = v('f_banner_label').trim() || '專 案 合 約 書';

  var blocks = [];
  document.querySelectorAll('#art-list .blk').forEach(function (w) {
    var h = buildArticleHtml(w);
    if (h) blocks.push({ page: pageOf(w.querySelector('.a-page')), html: h });
  });
  var h = buildSigHtml();
  if (h) blocks.push({ page: pageOf(document.getElementById('f_sig_page')), html: h });

  var validityHtml = buildValidityHtml();
  var validityPage = pageOf(document.getElementById('f_validity_page'));

  var pageTotal = 1;
  blocks.forEach(function (b) { if (b.page > pageTotal) pageTotal = b.page; });
  if (validityHtml && validityPage > pageTotal) pageTotal = validityPage;

  var metaHtml = '<div class="header-meta">' +
    '<div class="meta-item"><span class="label">合約編號：</span><span class="value">' + xmlEsc(ctNo) + '</span></div>' +
    (v('f_execution_date').trim() ? '<div class="meta-item"><span class="label">立約日期：</span><span class="value">' + xmlEsc(v('f_execution_date').trim()) + '</span></div>' : '') +
    (v('f_doc_type').trim() ? '<div class="meta-item"><span class="label">文件性質：</span><span class="value">' + xmlEsc(v('f_doc_type').trim()) + '</span></div>' : '') +
    '</div>';

  var subtitle = v('f_subtitle').trim();
  var head1 =
    '<div class="doc-header-banner"><span class="banner-label">' + xmlEsc(bannerLabel) + '</span></div>\n' +
    '<div class="doc-header-body">\n' + metaHtml + '\n<h1>' + titleHtml + '</h1>\n' +
    (subtitle ? '<div class="subtitle">' + xmlEsc(subtitle) + '</div>\n' : '') +
    '</div>\n' +
    '<div class="parties">\n' +
    '<div class="party-box"><div class="role">' + xmlEsc(v('f_party_a_role') || '甲方') + '</div><div class="company">' + xmlEsc(companyA || '＿＿＿＿＿＿') + '</div><div class="detail">' +
      partyDetailHtml(v('f_party_a_details')) + '</div></div>\n' +
    '<div class="party-box"><div class="role">' + xmlEsc(v('f_party_b_role') || '乙方') + '</div><div class="company">' + xmlEsc(companyB) + '</div><div class="detail">' +
      partyDetailHtml(v('f_party_b_details')) + '</div></div>\n' +
    '</div>\n';

  var footer = buildFooter(ctNo, companyA, companyB);
  var pagesHtml = '';
  for (var p = 1; p <= pageTotal; p++) {
    pagesHtml += '<!-- PAGE ' + p + ' -->\n<div class="a4-page">\n';
    if (p === 1) {
      pagesHtml += head1;
    } else {
      pagesHtml += '<div class="page-mini-header"><span class="mini-doc-id">' + xmlEsc(ctNo) + '</span><span class="mini-page-num">第 ' + p + ' 頁，共 ' + pageTotal + ' 頁</span></div>\n';
    }
    blocks.forEach(function (b) { if (b.page === p) pagesHtml += b.html; });
    if (validityHtml && p === validityPage) pagesHtml += validityHtml;
    pagesHtml += footer + '</div>\n';
  }

  var tpl = document.getElementById('qtTpl').textContent;
  tpl = tpl.replace('__PAGES__', pagesHtml);
  tpl = tpl.split('{Client Company}').join(companyA);
  tpl = tpl.split('{Doc Title Plain}').join(titlePlain);
  return tpl;
}

function refreshOutput() {
  var html = buildDoc();
  document.getElementById('preview-frame').srcdoc = html;
  document.getElementById('out-html').value = html;
  persistSessionDraft();
}

function previewDoc() {
  var html = buildDoc();
  var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  window.open(URL.createObjectURL(blob), '_blank');
}

function generateDoc() {
  var html = buildDoc();
  var ctNo = v('f_ct_no') || 'CT';
  var company = v('f_party_a_company') || '合約';
  var filename = ctNo + '_' + company + '-合約書.html';
  var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

/* ============================================================
   按鈕與輸入事件綁定
   ============================================================ */
document.getElementById('open-btn').addEventListener('click', previewDoc);
document.getElementById('download-btn').addEventListener('click', generateDoc);
document.getElementById('copy-btn').addEventListener('click', function () {
  var status = document.getElementById('copy-status');
  navigator.clipboard.writeText(document.getElementById('out-html').value).then(function () {
    status.textContent = '已複製！';
    setTimeout(function () { status.textContent = ''; }, 1500);
  }, function () {
    status.textContent = '複製失敗，請手動選取後複製';
    setTimeout(function () { status.textContent = ''; }, 2000);
  });
});

document.querySelector('.form-panel').addEventListener('input', refreshOutput);

/* ============================================================
   離開頁面前提醒（避免未存檔資料遺失）
   ============================================================ */
var _isDirty = false;
document.querySelector('.form-panel').addEventListener('input', function () { _isDirty = true; });
window.addEventListener('beforeunload', function (e) {
  if (!_isDirty) return;
  e.preventDefault();
  e.returnValue = '';
});

/* ============================================================
   草稿存讀（下載 JSON / 載入 JSON）
   ============================================================ */
var FIELD_IDS = [
  'f_ct_no', 'f_banner_label', 'f_execution_date', 'f_doc_type', 'f_doc_title', 'f_subtitle',
  'f_party_a_role', 'f_party_a_company', 'f_party_a_details',
  'f_party_b_role', 'f_party_b_company', 'f_party_b_details',
  'f_sig_page', 'f_sig_desc',
  'f_validity_page', 'f_validity_text'
];

function collectDraft() {
  var draft = { kind: 'dghm-contract-draft', version: 1, fields: {}, articles: [] };
  FIELD_IDS.forEach(function (id) { draft.fields[id] = v(id); });
  draft.fields.f_sig_on = document.getElementById('f_sig_on').checked;
  draft.fields.f_validity_on = document.getElementById('f_validity_on').checked;

  document.querySelectorAll('#art-list .blk').forEach(function (w) {
    draft.articles.push({
      title: w.querySelector('.a-title').value,
      body: w.querySelector('.a-body').value,
      page: w.querySelector('.a-page').value
    });
  });
  return draft;
}

function setDraftStatus(message) {
  document.getElementById('draft-status').textContent = message || '';
}

function sessionTimeLabel() {
  return new Date().toLocaleTimeString('zh-TW', {
    hour: '2-digit',
    minute: '2-digit'
  });
}

function persistSessionDraft() {
  if (_suspendSessionSave) return;
  try {
    localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(collectDraft()));
    setDraftStatus('已自動暫存 ' + sessionTimeLabel());
  } catch (err) {
    setDraftStatus('本機暫存失敗');
  }
}

function clearSessionDraft(showMessage) {
  localStorage.removeItem(SESSION_STORAGE_KEY);
  if (showMessage) setDraftStatus('已清除本機暫存');
}

function applyDraft(draft) {
  _suspendSessionSave = true;
  FIELD_IDS.forEach(function (id) {
    if (draft.fields && id in draft.fields) {
      var el = document.getElementById(id);
      if (el) el.value = draft.fields[id];
    }
  });
  if (draft.fields) {
    if ('f_sig_on' in draft.fields) document.getElementById('f_sig_on').checked = !!draft.fields.f_sig_on;
    if ('f_validity_on' in draft.fields) document.getElementById('f_validity_on').checked = !!draft.fields.f_validity_on;
  }

  document.getElementById('art-list').innerHTML = '';
  (draft.articles && draft.articles.length ? draft.articles : [{ title: '第一條｜合約目的', page: 1 }]).forEach(function (a) {
    addArticle(a);
  });

  _suspendSessionSave = false;
  refreshOutput();
}

function restoreSessionDraft() {
  var raw = localStorage.getItem(SESSION_STORAGE_KEY);
  if (!raw) return false;
  try {
    applyDraft(JSON.parse(raw));
    _sessionRestored = true;
    setDraftStatus('已恢復上次工作 session');
    return true;
  } catch (err) {
    clearSessionDraft(false);
    setDraftStatus('上次暫存損毀，已略過');
    return false;
  }
}

document.getElementById('save-draft-btn').addEventListener('click', function () {
  var draft = collectDraft();
  var blob = new Blob([JSON.stringify(draft, null, 2)], { type: 'application/json;charset=utf-8' });
  var ctNo = v('f_ct_no') || 'draft';
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = ctNo + '-草稿.json';
  a.click();
});

document.getElementById('load-draft-btn').addEventListener('click', function () {
  document.getElementById('load-draft-input').click();
});

document.getElementById('clear-session-btn').addEventListener('click', function () {
  clearSessionDraft(true);
});

document.getElementById('load-draft-input').addEventListener('change', function (e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () {
    try {
      var draft = JSON.parse(reader.result);
      applyDraft(draft);
      persistSessionDraft();
      setDraftStatus('已載入草稿 JSON，並更新本機暫存');
    } catch (err) {
      alert('草稿檔案格式錯誤，無法載入。');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

/* ============================================================
   初始化
   ============================================================ */
_suspendSessionSave = true;
addArticle({ title: '第一條｜合約目的', page: 1, body: '雙方依誠信原則訂立本合約，明確服務範疇與報酬計算方式。' });
addArticle({ title: '第二條｜服務範圍', page: 1, body: '乙方提供甲方以下服務：\n1. 技術服務執行\n2. 業務開發支援\n3. 專案管理' });
refreshOutput();
initFormAccordions();
if (!restoreSessionDraft()) _suspendSessionSave = false;

(function () {
  if (_sessionRestored) return;
  var params = new URLSearchParams(window.location.search);
  var company = params.get('company');
  var project = params.get('project');
  var date = params.get('date');
  if (!company && !project && !date) return;

  if (company) document.getElementById('f_party_a_company').value = company;
  if (date) document.getElementById('f_execution_date').value = date;
  var titleEl = document.getElementById('f_doc_title');
  if (project) titleEl.value = project;
  refreshOutput();
})();

if (!_sessionRestored) {
  _suspendSessionSave = false;
  persistSessionDraft();
}
</script>
</body>
</html>
