<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客戶資料管理 · DGHM 工作台</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="dghm-ui.css">
  <link rel="stylesheet" href="app-shell.css">
  <style>
    .client-page { display: grid; grid-template-columns: 350px minmax(0, 1fr); height: 100%; min-height: 0; }
    .has-app-shell #tool-workspace { height: 100%; min-height: 0; }
    .records-column, .editor-column { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .records-column { border-right: 1px solid var(--surface-border); background: var(--surface-panel-bg); }
    .client-head { padding: 22px 20px 18px; border-bottom: 1px solid var(--surface-border); background: var(--surface-bg); }
    .client-eyebrow { margin: 0 0 5px; color: var(--orange); font-size: 10px; font-weight: 800; letter-spacing: .14em; }
    .client-head h1 { margin: 0 0 7px; color: var(--navy-text); font-size: 24px; }
    .client-head .intro { margin: 0; color: var(--surface-text-muted); font-size: 12px; line-height: 1.6; }
    .records-tools { display: flex; flex-wrap: wrap; gap: 8px; padding: 18px 20px 12px; }
    .records-search { width: 100%; min-width: 0; box-sizing: border-box; padding: 11px; border: 1px solid var(--surface-border); border-radius: var(--radius-xs); background: var(--surface-bg); color: var(--surface-text); font: inherit; font-size: 13px; }
    .records-tools button { flex: 1; }
    .records-status { margin: 0; padding: 0 20px 14px; color: var(--surface-text-muted); font-size: 12px; line-height: 1.6; }
    .records-results { flex: 1; min-height: 0; overflow-y: auto; padding: 0 12px 16px; }
    .records-list-head, .customer-result { display: grid; grid-template-columns: 36px minmax(0, 1fr) minmax(0, 0.7fr); align-items: center; gap: 10px; padding: 12px; }
    .records-list-head { position: sticky; top: 0; background: var(--surface-panel-bg); color: var(--surface-text-muted); font-size: 11px; font-weight: 700; border-bottom: 1px solid var(--surface-border); }
    .records-sort { display: inline-flex; align-items: center; gap: 3px; padding: 0; border: 0; background: transparent; color: inherit; font: inherit; font-weight: inherit; cursor: pointer; }
    .records-sort:hover { color: var(--navy-text); }
    .customer-result { width: 100%; min-height: 46px; box-sizing: border-box; margin: 0; border: 0; border-bottom: 1px solid var(--surface-border); border-radius: 0; background: transparent; color: var(--surface-text); text-align: left; font: inherit; font-size: 13px; cursor: pointer; }
    .customer-result:hover { background: var(--surface-bg); }
    .customer-result.is-selected { background: color-mix(in srgb, var(--orange) 10%, var(--surface-bg)); box-shadow: inset 3px 0 var(--orange); }
    .customer-result strong { color: var(--navy-text); font-size: 13px; overflow-wrap: anywhere; }
    .customer-id { color: var(--surface-text-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .records-pagination { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px; border-top: 1px solid var(--surface-border); color: var(--surface-text-muted); font-size: 11px; }
    [hidden] { display: none !important; }
    .editor-column { background: var(--surface-bg); }
    .editor-empty { display: flex; flex: 1; align-items: center; justify-content: center; padding: 40px; text-align: center; color: var(--surface-text-muted); }
    .editor-empty h2 { color: var(--navy-text); font-size: 21px; margin: 0 0 10px; }
    .editor-empty p { font-size: 13px; line-height: 1.8; margin: 0; }
    .editor-panel { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    .editor-head { padding: 22px 24px 0; border-bottom: 1px solid var(--surface-border); background: var(--surface-panel-bg); }
    .editor-title-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .editor-head h2 { margin: 0; color: var(--navy-text); font-size: 21px; }
    .editor-subtitle { margin: 7px 0 18px; color: var(--surface-text-muted); font-size: 12px; }
    .editor-tabs { display: flex; gap: 20px; }
    .editor-tab { padding: 12px 2px; border: 0; border-bottom: 3px solid transparent; background: transparent; color: var(--surface-text-muted); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
    .editor-tab[aria-selected="true"] { color: var(--navy-text); border-bottom-color: var(--orange); }
    #client-form { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    .editor-body { flex: 1; min-height: 0; overflow-y: auto; padding: 24px; }
    .client-card { max-width: 900px; padding: 22px; background: var(--surface-panel-bg); border-radius: var(--radius); border: 1px solid var(--surface-border); }
    .client-card h2 { margin: 0 0 18px; color: var(--navy-text); font-size: 16px; }
    .client-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .client-field { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
    .client-field select[multiple] { min-height: 112px; padding-block: 6px; }
    .field-help { color: var(--surface-text-muted); font-size: 11px; line-height: 1.5; }
    .client-field.wide { grid-column: 1 / -1; }
    .client-field label { color: var(--surface-text); font-size: 13px; font-weight: 700; }
    .client-field .optional { color: var(--surface-text-muted); font-weight: 400; }
    .client-field input, .client-field select, .client-field textarea { width: 100%; box-sizing: border-box; padding: 10px 11px; border: 1px solid var(--surface-border); border-radius: var(--radius-xs); background: var(--surface-bg); color: var(--surface-text); font: inherit; font-size: 14px; }
    .client-field textarea { min-height: 82px; resize: vertical; }
    :is(input, select, textarea, button):focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
    .client-note { margin: 18px 0 0; color: var(--surface-text-muted); font-size: 12px; line-height: 1.7; }
    .client-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 16px 24px; border-top: 1px solid var(--surface-border); background: var(--surface-panel-bg); }
    .client-submit { border: 0; border-radius: var(--radius-xs); padding: 11px 16px; background: var(--orange); color: #fff; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    .client-status { margin: 0; color: var(--surface-text-muted); font-size: 13px; }
    .client-status.ok { color: #1E7B34; }
    .client-status.error { color: #C0392B; }
    .client-status a { color: inherit; text-decoration: underline; }
    .secondary-btn { border: 1px solid var(--surface-border); border-radius: var(--radius-xs); padding: 9px 12px; background: var(--surface-bg); color: var(--navy-text); font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
    .secondary-btn:hover { border-color: var(--navy); }
    .contact-picker { display: none; margin-bottom: 20px; }
    .contact-picker.is-visible { display: flex; }
    .back-to-results { display: none; }
    @media (max-width: 1100px) { .client-page { grid-template-columns: 300px minmax(0, 1fr); } .client-grid { grid-template-columns: 1fr; } .client-field.wide { grid-column: auto; } }
    @media (max-width: 760px) {
      .client-page { grid-template-columns: minmax(0, 1fr); }
      .client-page.has-editor .records-column, .client-page:not(.has-editor) .editor-column { display: none; }
      .back-to-results { display: inline-block; }
      .editor-head { padding: 20px 16px 0; }
      .editor-body { padding: 16px; }
      .client-card { padding: 18px; }
      .client-actions { padding: 14px 16px; }
    }
  </style>
</head>
<body data-tool="airtable-client">
<div id="tool-workspace">
  <div class="client-page">
    <section class="records-column" aria-labelledby="records-heading">
      <header class="client-head">
        <p class="client-eyebrow">CUSTOMER WORKSPACE</p>
        <h1 id="records-heading">客戶資料管理</h1>
        <p class="intro">從下方清單選擇客戶，在右側查看及編輯；也可依編號、公司或聯絡人搜尋。</p>
      </header>
        <div class="records-tools">
          <input class="records-search" id="records-search" type="search" placeholder="輸入編號、公司或聯絡人" aria-label="搜尋客戶編號、公司或聯絡人">
          <button class="secondary-btn" id="records-search-button" type="button">搜尋</button>
          <button class="client-submit" id="new-client" type="button">新增客戶</button>
        </div>
      <p class="records-status" id="records-status" role="status">正在讀取 Airtable…</p>
      <div class="records-results" id="records-table-wrap" hidden></div>
      <div class="records-pagination" id="records-pagination" hidden></div>
    </section>
    <section class="editor-column" aria-label="客戶詳細資料">
      <div class="editor-empty" id="editor-empty"><div><h2>選擇一位客戶</h2><p>從左側列表點選客戶，這裡會顯示公司與聯絡人資料。<br>也可以搜尋客戶，或點「新增客戶」建立資料。</p></div></div>
      <div class="editor-panel" id="editor-panel" hidden>
        <header class="editor-head">
          <div class="editor-title-row"><h2 id="editor-summary">新增客戶資料</h2><button class="secondary-btn back-to-results" id="back-to-results" type="button">返回搜尋</button></div>
          <p class="editor-subtitle" id="edit-banner-text">填寫公司資料，可另加一位聯絡人。</p>
          <div class="editor-tabs" role="tablist" aria-label="客戶資料類別">
            <button class="editor-tab" id="company-tab" role="tab" aria-selected="true" aria-controls="company-view" data-editor-tab="company" type="button">公司資料</button>
            <button class="editor-tab" id="contact-tab" role="tab" aria-selected="false" aria-controls="contact-view" data-editor-tab="contact" tabindex="-1" type="button">聯絡人</button>
          </div>
        </header>
      <form id="client-form" novalidate>
      <div class="editor-body">
      <section class="client-card" id="company-view" role="tabpanel" aria-labelledby="company-tab" data-editor-view="company">
        <h2 id="company-heading">公司資料</h2>
        <div class="client-grid">
          <div class="client-field"><label for="clientName">英文簡稱 <span aria-hidden="true">*</span></label><input id="clientName" name="clientName" required maxlength="500" autocomplete="organization" placeholder="例：TailorMed"></div>
          <div class="client-field"><label for="chineseShortName">中文簡稱 <span class="optional">選填</span></label><input id="chineseShortName" name="chineseShortName" maxlength="500" placeholder="例：崴宇"></div>
          <div class="client-field"><label for="fullName">客戶全稱 <span class="optional">選填</span></label><input id="fullName" name="fullName" maxlength="500" placeholder="公司登記全名"></div>
          <div class="client-field"><label for="brandName">公司／品牌名稱 <span class="optional">選填</span></label><input id="brandName" name="brandName" maxlength="500"></div>
          <div class="client-field"><label for="taxId">統編 <span class="optional">選填</span></label><input id="taxId" name="taxId" inputmode="numeric" maxlength="20"></div>
          <div class="client-field wide"><label for="clientAddress">客戶地址 <span class="optional">選填</span></label><textarea id="clientAddress" name="clientAddress" maxlength="500"></textarea></div>
          <div class="client-field"><label for="website">網站 <span class="optional">選填</span></label><input id="website" name="website" type="url" maxlength="500" placeholder="https://example.com"></div>
          <div class="client-field"><label for="industry">產業類別 <span class="optional">可複選</span></label><select id="industry" name="industry" multiple size="4"></select><span class="field-help">Mac 按住 Command、Windows 按住 Ctrl 可選擇多項</span></div>
          <div class="client-field"><label for="source">來源管道 <span class="optional">選填</span></label><select id="source" name="source"><option value="">未指定</option></select></div>
          <div class="client-field"><label for="payment">Payment <span class="optional">選填</span></label><select id="payment" name="payment"><option value="">未指定</option></select></div>
        </div>
      </section>
      <section class="client-card" id="contact-view" role="tabpanel" aria-labelledby="contact-tab" data-editor-view="contact" hidden>
        <h2 id="contact-heading">聯絡人資料</h2>
        <div class="client-field contact-picker" id="contact-picker-wrap">
          <label for="contact-picker">要編輯的聯絡人</label>
          <select id="contact-picker"></select>
        </div>
        <div class="client-grid">
          <div class="client-field"><label for="contactName">聯絡人姓名 <span class="optional">選填</span></label><input id="contactName" name="contactName" maxlength="500" autocomplete="name" placeholder="例：王小明"></div>
          <div class="client-field"><label for="contactTitle">聯絡人職稱 <span class="optional">選填</span></label><input id="contactTitle" name="contactTitle" maxlength="500"></div>
          <div class="client-field"><label for="phone">聯絡電話 <span class="optional">選填</span></label><input id="phone" name="phone" type="tel" maxlength="500" autocomplete="tel"></div>
          <div class="client-field"><label for="email">電子郵件 <span class="optional">選填</span></label><input id="email" name="email" type="email" maxlength="500" autocomplete="email"></div>
          <div class="client-field"><label for="address">地址 <span class="optional">選填</span></label><input id="address" name="address" maxlength="500"></div>
          <div class="client-field wide"><label for="notes">備註 <span class="optional">選填</span></label><textarea id="notes" name="notes" maxlength="5000"></textarea></div>
        </div>
        <p class="client-note">卡片與此頁的聯絡人清單以公司表的「聯絡人姓名」Links 欄位為準。選擇既有聯絡人只會更新該筆資料；新增聯絡人會自動加入「聯絡人姓名」。</p>
      </section>
      </div>
      <div class="client-actions">
        <button class="client-submit" id="submit-button" type="submit">新增到 Airtable</button>
        <button class="secondary-btn" id="form-reset" type="button">清空表單</button>
        <button class="secondary-btn" id="cancel-edit" type="button">關閉</button>
        <p id="client-status" class="client-status" role="status" aria-live="polite"></p>
      </div>
      </form>
      </div>
    </section>
  </div>
</div>
<script src="tool-registry.js"></script>
<script src="project-context.js"></script>
<script src="app-shell.js"></script>
<script>mountAppShell({ activeTool: 'airtable-client' });</script>
<script src="dghm-ui.js"></script>
<script>
initTheme('my-agent-theme');
const form = document.getElementById('client-form');
const status = document.getElementById('client-status');
const button = document.getElementById('submit-button');
const recordsStatus = document.getElementById('records-status');
const recordsWrap = document.getElementById('records-table-wrap');
const pagination = document.getElementById('records-pagination');
const search = document.getElementById('records-search');
const editorPanel = document.getElementById('editor-panel');
const editorSummary = document.getElementById('editor-summary');
const editorEmpty = document.getElementById('editor-empty');
const clientPage = document.querySelector('.client-page');
const editBannerText = document.getElementById('edit-banner-text');
const contactPickerWrap = document.getElementById('contact-picker-wrap');
const contactPicker = document.getElementById('contact-picker');
let records = [];
let editingCompanyId = '';
let editingContactId = '';
let currentPage = 1;
let idSortDirection = 'desc';
let recordsLoaded = false;
let optionsWarning = '';
let recordsLoading = false;
const PAGE_SIZE = 10;

function esc(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function contactSummary(company) {
  return (company.contacts || []).map((contact) => contact.contactName).filter(Boolean).join('、');
}

function formatClientNumber(value) {
  const number = Number(value);
  if (!value || !Number.isFinite(number)) return String(value || '');
  return String(Math.trunc(number)).padStart(2, '0');
}

function applySelectOptions(selectOptions = {}) {
  ['industry', 'source', 'payment'].forEach((name) => {
    const select = form.elements.namedItem(name);
    const current = select.multiple ? [...select.selectedOptions].map((option) => option.value) : select.value;
    select.innerHTML = (select.multiple ? '' : '<option value="">未指定</option>') + (selectOptions[name] || [])
      .map((value) => `<option value="${esc(value)}">${esc(value)}</option>`).join('');
    if (select.multiple) [...select.options].forEach((option) => { option.selected = current.includes(option.value); });
    else if ([...select.options].some((option) => option.value === current)) select.value = current;
  });
}

function renderRecords() {
  const keyword = search.value.trim().toLowerCase();
  const filtered = records.filter((company) => {
    const text = [company.clientNumber, formatClientNumber(company.clientNumber), company.clientName, company.chineseShortName, company.fullName, company.brandName, company.website, contactSummary(company)]
      .join(' ').toLowerCase();
    return !keyword || text.includes(keyword);
  }).sort((a, b) => {
    const aNumber = Number(a.clientNumber);
    const bNumber = Number(b.clientNumber);
    const aValid = Number.isFinite(aNumber);
    const bValid = Number.isFinite(bNumber);
    if (!aValid && !bValid) return 0;
    if (!aValid) return 1;
    if (!bValid) return -1;
    return idSortDirection === 'asc' ? aNumber - bNumber : bNumber - aNumber;
  });
  const pageCount = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  currentPage = Math.min(Math.max(currentPage, 1), pageCount);
  const pageStart = (currentPage - 1) * PAGE_SIZE;
  const pageRows = filtered.slice(pageStart, pageStart + PAGE_SIZE);
  recordsStatus.textContent = `${keyword ? '找到' : '共'} ${filtered.length} ${keyword ? '筆' : '家客戶'}${filtered.length > PAGE_SIZE ? `，第 ${currentPage}／${pageCount} 頁` : ''}${optionsWarning ? ` · ${optionsWarning}` : ''}`;
  recordsWrap.hidden = false;
  if (!filtered.length) {
    recordsWrap.innerHTML = '<p class="records-status">找不到符合的資料。</p>';
    pagination.hidden = true;
    pagination.innerHTML = '';
    return;
  }
  const sortLabel = idSortDirection === 'asc' ? '由小到大' : '由大到小';
  const sortArrow = idSortDirection === 'asc' ? '▲' : '▼';
  recordsWrap.innerHTML = `<div class="records-list-head"><button class="records-sort" type="button" data-sort-id aria-label="ID 排序，目前${sortLabel}，點擊切換">ID ${sortArrow}</button><span>英文簡稱</span><span>中文簡稱</span></div>` + pageRows.map((company) => `<button class="customer-result ${company.id === editingCompanyId ? 'is-selected' : ''}" type="button" data-edit-id="${esc(company.id)}" aria-pressed="${company.id === editingCompanyId}">
    <span class="customer-id">${company.clientNumber ? esc(formatClientNumber(company.clientNumber)) : '—'}</span>
    <strong>${esc(company.clientName || '—')}</strong>
    <span>${esc(company.chineseShortName || '—')}</span>
  </button>`).join('');
  pagination.hidden = filtered.length <= PAGE_SIZE;
  pagination.innerHTML = `<button class="secondary-btn" type="button" data-page-action="prev" ${currentPage === 1 ? 'disabled' : ''}>上一頁</button>
    <span>第 ${currentPage}／${pageCount} 頁</span>
    <button class="secondary-btn" type="button" data-page-action="next" ${currentPage === pageCount ? 'disabled' : ''}>下一頁</button>`;
}

function setField(name, value) {
  const field = form.elements.namedItem(name);
  if (!field) return;
  if (field instanceof HTMLSelectElement && field.multiple) {
    const values = Array.isArray(value) ? value : [];
    [...field.options].forEach((option) => { option.selected = values.includes(option.value); });
    return;
  }
  field.value = value || '';
}

function fillContact(contact) {
  setField('contactName', contact?.contactName);
  setField('contactTitle', contact?.contactTitle);
  setField('phone', contact?.phone);
  setField('email', contact?.email);
  setField('address', contact?.address);
  setField('notes', contact?.notes);
  editingContactId = contact?.id || '';
}

function startEdit(companyId) {
  const company = records.find((item) => item.id === companyId);
  if (!company) return;
  form.reset();
  editingCompanyId = company.id;
  ['clientName', 'chineseShortName', 'fullName', 'brandName', 'taxId', 'clientAddress', 'website', 'industry', 'source', 'payment']
    .forEach((key) => setField(key, company[key]));
  const contacts = company.contacts || [];
  contactPicker.innerHTML = contacts.map((contact) => `<option value="${esc(contact.id)}">${esc(contact.contactName || '未命名聯絡人')}</option>`).join('') +
    '<option value="">＋ 新增聯絡人</option>';
  contactPickerWrap.classList.add('is-visible');
  contactPicker.value = contacts[0]?.id || '';
  fillContact(contacts[0] || null);
  editBannerText.textContent = `${company.clientNumber ? `客戶編號 #${formatClientNumber(company.clientNumber)} · ` : ''}${(company.contacts || []).length} 位聯絡人`;
  button.textContent = '儲存修改';
  status.textContent = '';
  editorSummary.textContent = company.clientName || '編輯客戶資料';
  openEditor();
  renderRecords();
}

function resetEditor(closePanel = false) {
  form.reset();
  editingCompanyId = '';
  editingContactId = '';
  contactPickerWrap.classList.remove('is-visible');
  contactPicker.innerHTML = '';
  button.textContent = '新增到 Airtable';
  status.textContent = '';
  status.className = 'client-status';
  editorSummary.textContent = '新增客戶資料';
  editBannerText.textContent = '填寫公司資料，可另加一位聯絡人。';
  setEditorTab('company');
  if (closePanel) closeEditor();
  else if (recordsLoaded) renderRecords();
}

function setEditorTab(name) {
  document.querySelectorAll('[data-editor-tab]').forEach((tab) => {
    const active = tab.dataset.editorTab === name;
    tab.setAttribute('aria-selected', String(active));
    tab.tabIndex = active ? 0 : -1;
  });
  document.querySelectorAll('[data-editor-view]').forEach((view) => { view.hidden = view.dataset.editorView !== name; });
  document.querySelector('.editor-body').scrollTop = 0;
}

function openEditor() {
  editorPanel.hidden = false;
  editorEmpty.hidden = true;
  clientPage.classList.add('has-editor');
  setEditorTab('company');
}

function closeEditor() {
  editorPanel.hidden = true;
  editorEmpty.hidden = false;
  clientPage.classList.remove('has-editor');
  if (recordsLoaded) renderRecords();
}

document.querySelectorAll('[data-editor-tab]').forEach((tab) => {
  tab.addEventListener('click', () => setEditorTab(tab.dataset.editorTab));
  tab.addEventListener('keydown', (event) => {
    if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
    event.preventDefault();
    const name = event.key === 'Home' ? 'company' : event.key === 'End' ? 'contact' : tab.dataset.editorTab === 'company' ? 'contact' : 'company';
    setEditorTab(name);
    document.getElementById(`${name}-tab`).focus();
  });
});
document.getElementById('back-to-results').addEventListener('click', () => {
  clientPage.classList.remove('has-editor');
  search.focus();
});

async function loadRecords() {
  if (recordsLoading) return;
  recordsLoading = true;
  recordsStatus.textContent = '正在讀取 Airtable…';
  recordsWrap.hidden = true;
  try {
    const response = await fetch('/api/airtable/client', { credentials: 'same-origin', cache: 'no-store' });
    const result = await response.json();
    if (!response.ok || !result.ok) throw new Error(result.error || '讀取失敗');
    records = result.records || [];
    optionsWarning = result.optionsWarning || '';
    applySelectOptions(result.selectOptions);
    recordsLoaded = true;
    currentPage = 1;
    renderRecords();
  } catch (error) {
    recordsStatus.textContent = error.message || '無法讀取 Airtable。';
    if (/登入/.test(recordsStatus.textContent)) recordsStatus.innerHTML = '請先 <a href="login.html">登入工作台</a>。';
  } finally {
    recordsLoading = false;
  }
}

recordsWrap.addEventListener('click', (event) => {
  if (event.target.closest('[data-sort-id]')) {
    idSortDirection = idSortDirection === 'asc' ? 'desc' : 'asc';
    currentPage = 1;
    renderRecords();
    return;
  }
  const target = event.target.closest('[data-edit-id]');
  if (target) startEdit(target.dataset.editId);
});
pagination.addEventListener('click', (event) => {
  const action = event.target.closest('[data-page-action]')?.dataset.pageAction;
  if (!action) return;
  currentPage += action === 'next' ? 1 : -1;
  renderRecords();
  recordsWrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
});
search.addEventListener('input', () => {
  currentPage = 1;
  if (recordsLoaded) renderRecords();
});
search.addEventListener('keydown', (event) => {
  if (event.key !== 'Enter') return;
  event.preventDefault();
  if (recordsLoaded) renderRecords();
  else loadRecords();
});
document.getElementById('records-search-button').addEventListener('click', () => {
  if (recordsLoaded) renderRecords();
  else loadRecords();
});
document.getElementById('new-client').addEventListener('click', async () => {
  if (!recordsLoaded) await loadRecords();
  resetEditor();
  openEditor();
});
document.getElementById('cancel-edit').addEventListener('click', () => resetEditor(true));
document.getElementById('form-reset').addEventListener('click', () => resetEditor());
contactPicker.addEventListener('change', () => {
  const company = records.find((item) => item.id === editingCompanyId);
  const contact = (company?.contacts || []).find((item) => item.id === contactPicker.value);
  fillContact(contact || null);
});

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const invalid = form.querySelector(':invalid');
  if (invalid) {
    setEditorTab(invalid.closest('[data-editor-view]')?.dataset.editorView || 'company');
    invalid.reportValidity();
    return;
  }
  const formData = new FormData(form);
  const data = Object.fromEntries(formData.entries());
  data.industry = formData.getAll('industry');
  const wasEditing = Boolean(editingCompanyId);
  const savedCompanyId = editingCompanyId;
  const savedContactId = editingContactId;
  const savedTab = document.querySelector('[data-editor-tab][aria-selected="true"]')?.dataset.editorTab || 'company';
  if (editingCompanyId) data.recordId = editingCompanyId;
  if (editingContactId) data.contactId = editingContactId;
  button.disabled = true;
  status.className = 'client-status';
  status.textContent = editingCompanyId ? '正在更新 Airtable…' : '正在寫入 Airtable…';
  try {
    const response = await fetch('/api/airtable/client', {
      method: editingCompanyId ? 'PUT' : 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });
    const result = await response.json();
    if (!response.ok || !result.ok) {
      if (response.status === 401) {
        status.innerHTML = '請先 <a href="login.html">登入工作台</a>，再新增客戶。';
      } else {
        status.textContent = result.error || '寫入失敗，請稍後再試。';
      }
      status.className = 'client-status error';
      return;
    }
    const action = wasEditing ? '更新' : '新增';
    await loadRecords();
    const successMessage = `已${action}「${result.clientName}」${result.contactId ? '及其聯絡人' : ''}，Airtable 資料已重新載入。`;
    if (wasEditing) {
      startEdit(savedCompanyId);
      const company = records.find((item) => item.id === savedCompanyId);
      const refreshedContactId = result.contactId || savedContactId;
      const contact = (company?.contacts || []).find((item) => item.id === refreshedContactId);
      if (contact) {
        contactPicker.value = contact.id;
        fillContact(contact);
      }
      setEditorTab(savedTab);
      status.textContent = successMessage;
      status.className = 'client-status ok';
    } else {
      resetEditor(true);
    }
    recordsStatus.textContent = successMessage;
  } catch {
    status.textContent = '無法連到工作台 API，請確認使用 Netlify 環境開啟頁面。';
    status.className = 'client-status error';
  } finally {
    button.disabled = false;
  }
});
loadRecords();
</script>
</body>
</html>
