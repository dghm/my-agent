<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px 24px;background:var(--surface-page)}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Input, Select, Checkbox, Radio, Switch } = window.DesignSystem_c03e6e;
function Demo() {
  return (
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"18px 24px"}}>
      <Input label="姓名" placeholder="請輸入您的姓名" />
      <Input label="電話" error="請輸入有效的電話號碼" defaultValue="09xx" />
      <Input label="Email" hint="我們將於一個工作天內回覆" placeholder="name@example.com" />
      <Select label="空間類型" options={["住宅", "商業空間", "辦公室"]} />
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <Checkbox label="我同意個資使用聲明" defaultChecked />
        <Checkbox label="訂閱案例電子報" />
        <Checkbox label="停用狀態" disabled />
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        <Radio options={["住宅", "商業", "辦公"]} defaultValue="住宅" />
        <Switch label="接收案場進度通知" defaultChecked />
        <Switch label="靜音" />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body></html>
