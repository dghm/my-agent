<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
.row{display:flex;gap:12px;padding:16px}
.sw{flex:1;height:118px;border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:12px;box-sizing:border-box;color:#fff;font-size:12px}
.sw b{font-size:13px}.sw span{opacity:.75}
</style></head>
<body>
<div class="row">
  <div class="sw" style="background:var(--fp-primary)"><b>Primary 主色</b><span>#272a4f</span></div>
  <div class="sw" style="background:var(--fp-secondary)"><b>Secondary 輔助色</b><span>#39559a</span></div>
  <div class="sw" style="background:var(--fp-dark)"><b>Brand Dark</b><span>#1d1f38</span></div>
  <div class="sw" style="background:var(--fp-lite)"><b>Brand Lite</b><span>#797fa8</span></div>
</div>
</body></html>
