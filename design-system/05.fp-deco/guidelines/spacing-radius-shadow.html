<!-- @dsCard group="Spacing" viewport="700x150" name="Radius & Shadow" subtitle="2/4/8px corners · cool navy shadows" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{padding:20px 28px;background:var(--surface-page);display:flex;gap:20px}
.b{width:100px;height:80px;background:var(--surface-card);border:1px solid var(--border-subtle);display:flex;align-items:flex-end;padding:8px;box-sizing:border-box;font-size:11px;color:var(--text-faint)}
</style></head>
<body>
<div class="b" style="border-radius:var(--radius-sm)">sm · 2px</div>
<div class="b" style="border-radius:var(--radius-md)">md · 4px</div>
<div class="b" style="border-radius:var(--radius-lg)">lg · 8px</div>
<div class="b" style="border-radius:var(--radius-md);border:none;box-shadow:var(--shadow-sm)">shadow-sm</div>
<div class="b" style="border-radius:var(--radius-md);border:none;box-shadow:var(--shadow-md)">shadow-md</div>
<div class="b" style="border-radius:var(--radius-md);border:none;box-shadow:var(--shadow-lg)">shadow-lg</div>
</body></html>
