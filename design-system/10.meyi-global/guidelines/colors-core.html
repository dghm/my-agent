<!-- @dsCard group="Colors" viewport="700x150" name="Core Palette" subtitle="Black, white, and the single support color" -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);color:var(--text-primary);background:#fff}</style>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px;">
  <div style="border:1px solid var(--border-default);">
    <div style="height:72px;background:var(--black);"></div>
    <div style="padding:8px 10px;font-size:12px;"><b>--black</b><span style="color:var(--text-muted);float:right;font-family:var(--font-mono);">#000000</span></div>
  </div>
  <div style="border:1px solid var(--border-default);">
    <div style="height:72px;background:var(--white);border-bottom:1px solid var(--border-default);"></div>
    <div style="padding:8px 10px;font-size:12px;"><b>--white</b><span style="color:var(--text-muted);float:right;font-family:var(--font-mono);">#FFFFFF</span></div>
  </div>
  <div style="border:1px solid var(--border-default);">
    <div style="height:72px;background:var(--ink);"></div>
    <div style="padding:8px 10px;font-size:12px;"><b>--ink</b><span style="color:var(--text-muted);float:right;font-family:var(--font-mono);">#24272D</span></div>
  </div>
</div>
