<!-- @dsCard group="Spacing" viewport="700x150" name="Borders &amp; Shadows" subtitle="Flat cards defined by borders; shadow only on overlays" -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);color:var(--text-primary);background:#fff}</style>
<div style="padding:20px 24px;display:flex;gap:16px;">
  <div style="flex:1;border:1px solid var(--border-default);padding:14px;font-size:12px;">
    <b>Card</b><br><span style="color:var(--text-secondary);">1px gray-200, no shadow</span>
  </div>
  <div style="flex:1;border:2px solid var(--border-strong);padding:14px;font-size:12px;">
    <b>Emphasis</b><br><span style="color:var(--text-secondary);">2px near-black</span>
  </div>
  <div style="flex:1;background:#fff;box-shadow:var(--shadow-overlay);padding:14px;font-size:12px;">
    <b>Overlay</b><br><span style="color:var(--text-secondary);">--shadow-overlay</span>
  </div>
</div>
