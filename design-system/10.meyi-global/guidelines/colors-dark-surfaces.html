<!-- @dsCard group="Colors" viewport="700x150" name="Dark Surfaces" subtitle="Inverse sections use ink, not pure black" -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);color:var(--text-primary);background:#fff}</style>
<div style="display:flex;gap:12px;padding:16px;">
  <div style="flex:1;background:var(--ink);padding:16px;color:var(--text-inverse);">
    <div style="font-size:11px;letter-spacing:var(--tracking-wide);color:var(--text-inverse-secondary);">SURFACE-INVERSE</div>
    <div style="font-size:15px;font-weight:600;margin-top:6px;">Primary text on ink</div>
    <div style="font-size:12px;color:var(--text-inverse-secondary);margin-top:2px;">Secondary at 64% white</div>
  </div>
  <div style="flex:1;background:var(--black);padding:16px;color:#fff;">
    <div style="font-size:11px;letter-spacing:var(--tracking-wide);color:rgba(255,255,255,.64);">PURE BLACK</div>
    <div style="font-size:15px;font-weight:600;margin-top:6px;">Reserved for max contrast</div>
    <div style="font-size:12px;color:rgba(255,255,255,.64);margin-top:2px;">Footer, hero overlays only</div>
  </div>
</div>
