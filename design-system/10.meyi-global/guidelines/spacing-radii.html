<!-- @dsCard group="Spacing" viewport="700x140" name="Corner Radii" subtitle="Near-square; pill reserved for badges" -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);color:var(--text-primary);background:#fff}</style>
<div style="padding:20px 24px;display:flex;gap:24px;align-items:center;">
  
  <div style="text-align:center;">
    <div style="width:72px;height:56px;border:1px solid var(--border-strong);border-radius:var(--radius-none);"></div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);margin-top:8px;">--radius-none · 0px</div>
  </div>
  <div style="text-align:center;">
    <div style="width:72px;height:56px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);"></div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);margin-top:8px;">--radius-sm · 2px</div>
  </div>
  <div style="text-align:center;">
    <div style="width:72px;height:56px;border:1px solid var(--border-strong);border-radius:var(--radius-md);"></div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);margin-top:8px;">--radius-md · 4px</div>
  </div>
  <div style="text-align:center;">
    <div style="width:96px;height:32px;border:1px solid var(--border-strong);border-radius:var(--radius-pill);margin-top:12px;"></div>
    <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);margin-top:8px;">--radius-pill</div>
  </div>
</div>
