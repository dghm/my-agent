<!-- @startingPoint section="Website" subtitle="Corporate marketing site — home, services, contact" viewport="1280x800" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meyi Global — Website UI Kit</title>
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:var(--white);}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="SiteChrome.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="ServicesScreen.jsx"></script>
<script type="text/babel" src="ContactScreen.jsx"></script>
<script type="text/babel">
function App() {
  const [page, setPage] = React.useState(localStorage.getItem("meyi-kit-page") || "Home");
  const nav = (p) => { setPage(p); localStorage.setItem("meyi-kit-page", p); window.scrollTo(0, 0); };
  return (
    <div data-screen-label={"Website — " + page}>
      <SiteHeader page={page} onNav={nav} />
      {page === "Home" && <HomeScreen onNav={nav} />}
      {page === "Services" && <ServicesScreen onNav={nav} />}
      {page === "Contact" && <ContactScreen />}
      <SiteFooter onNav={nav} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
