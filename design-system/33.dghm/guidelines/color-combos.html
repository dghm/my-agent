<!-- @dsCard group="Colors" viewport="700x230" name="配色組合 Combinations" subtitle="四種核心場景配色用法" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;padding:16px;background:#fff}
.c{border-radius:var(--radius-md);padding:14px;height:140px;display:flex;flex-direction:column;border:1px solid var(--dghm-line)}
.tag{font-size:9px;letter-spacing:var(--tracking-wide);font-family:var(--font-mono);align-self:flex-end;opacity:.7}
h3{font-size:14px;line-height:1.35;margin:auto 0 8px;font-weight:700}
.btn{background:var(--cta-bg);color:#fff;font-size:11px;font-weight:600;border-radius:var(--radius-sm);padding:5px 10px;align-self:flex-start}
.cap{font-size:10px;color:var(--text-secondary);margin-top:6px}
a{color:var(--text-link)}a:hover{color:var(--dghm-navy)}</style></head>
<body>
<div><div class="c" style="background:var(--dghm-navy);color:#fff"><span class="tag">COMBO 01</span><h3>先診斷・再設計</h3><span class="btn">立即諮詢 →</span></div><div class="cap">深藍底 × 白字 × 橘點綴</div></div>
<div><div class="c" style="background:#fff;color:var(--dghm-navy)"><span class="tag">COMBO 02</span><h3>客製數位系統</h3><span class="btn">立即諮詢 →</span></div><div class="cap">白底 × 深藍字 × 橘 CTA</div></div>
<div><div class="c" style="background:var(--dghm-pale);color:var(--dghm-navy)"><span class="tag">COMBO 03</span><h3>找出真正的痛點</h3></div><div class="cap">淡藍灰底 × 深藍字</div></div>
<div><div class="c" style="background:var(--dghm-orange);color:#fff"><span class="tag">COMBO 04</span><h3>+38% 效率提升</h3></div><div class="cap">橘底 × 白字</div></div>
</body></html>
