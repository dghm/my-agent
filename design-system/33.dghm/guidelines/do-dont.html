<!-- @dsCard group="Colors" viewport="700x210" name="Do / Don't" subtitle="配色使用守則" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px;background:#fff;color:var(--text-body)}
.col{border:1px solid var(--dghm-line);border-radius:var(--radius-md);padding:12px 14px}
h4{margin:0 0 8px;font-size:12px;display:flex;align-items:center;gap:6px}
.b{width:16px;height:16px;border-radius:50%;color:#fff;font-size:10px;display:inline-flex;align-items:center;justify-content:center}
ul{margin:0;padding-left:16px;font-size:11px;line-height:1.7;color:var(--text-secondary)}
a{color:var(--text-link)}a:hover{color:var(--dghm-navy)}</style></head>
<body>
<div class="col"><h4><span class="b" style="background:var(--dghm-navy)">✓</span>DO — 應該這樣做</h4>
<ul><li>以深海軍藍為所有版面的主色調基礎</li><li>橘色僅用於 CTA、數據標籤、重點強調,不超過版面 15%</li><li>白底或淡藍灰底搭配深藍正文,確保可讀性</li><li>CTA 按鈕一律橘色(#E5622A)+ 白色文字</li><li>印刷品使用 CMYK 色值,避免螢幕色偏</li></ul></div>
<div class="col"><h4><span class="b" style="background:var(--dghm-orange)">✕</span>DON'T — 不要這樣做</h4>
<ul><li>不可在橘色背景上使用深藍文字(對比不足)</li><li>不可任意改變色彩飽和度或明度</li><li>不可同一版面大量並用深藍底 + 橘底區塊</li><li>不可以淺灰色(#999)做為主要文字色</li><li>不可在白底上以極淡藍灰(#F4F7FB)作為文字</li></ul></div>
</body></html>
