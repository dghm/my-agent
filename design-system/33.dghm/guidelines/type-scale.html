<!-- @dsCard group="Type" viewport="700x180" name="字級系統 Type Scale" subtitle="Display 56 → Caption 12" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);padding:14px 24px;background:#fff;color:var(--text-heading)}
.r{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--dghm-line);padding:2px 0}
.t{font-family:var(--font-mono);font-size:10px;color:var(--text-secondary);width:150px;flex:none}
a{color:var(--text-link)}a:hover{color:var(--dghm-navy)}</style></head>
<body>
<div class="r"><span class="t">--text-display · 56px · 800</span><span style="font-size:30px;font-weight:800">系統實作 Hero</span></div>
<div class="r"><span class="t">--text-h1 · 40px · 700</span><span style="font-size:24px;font-weight:700">頁面標題 H1</span></div>
<div class="r"><span class="t">--text-h2 · 32px · 700</span><span style="font-size:20px;font-weight:700">區塊標題 H2</span></div>
<div class="r"><span class="t">--text-h3 · 24px · 600</span><span style="font-size:17px;font-weight:600">卡片標題 H3</span></div>
<div class="r"><span class="t">--text-body-md · 16px · 400</span><span style="font-size:15px;color:var(--text-body)">內文 Body</span></div>
<div class="r"><span class="t">--text-caption · 12px · 500</span><span style="font-size:12px;color:var(--text-secondary)">說明文字 Caption</span></div>
</body></html>
