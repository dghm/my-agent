<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);padding:18px 24px;background:#fff;color:var(--text-body);display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
p{font-size:15px;line-height:var(--leading-normal);margin:0 0 8px}
.sm{font-size:13px;color:var(--text-secondary)}
.w{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;border-bottom:1px solid var(--dghm-line)}
.w span:last-child{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)}
a{color:var(--text-link)}a:hover{color:var(--dghm-navy)}</style></head>
<body>
<div>
<p>我們深入你的營運現場,找出流程斷點,建立真正撐得住的系統 — 讓團隊處理兩倍的量,而不是兩倍的錯誤。</p>
<p class="sm">Shipping data, customs paperwork — errors slip through no matter how many times you check. 中英混排以 K2D 為主,繁中由 Noto Sans TC 補字。</p>
</div>
<div>
<div class="w" style="font-weight:300"><span>Light 淡</span><span>300</span></div>
<div class="w" style="font-weight:400"><span>Regular 標準</span><span>400</span></div>
<div class="w" style="font-weight:500"><span>Medium 中</span><span>500</span></div>
<div class="w" style="font-weight:600"><span>SemiBold 半粗</span><span>600</span></div>
<div class="w" style="font-weight:700"><span>Bold 粗</span><span>700</span></div>
<div class="w" style="font-weight:800"><span>ExtraBold 特粗</span><span>800</span></div>
</div>
</body></html>
