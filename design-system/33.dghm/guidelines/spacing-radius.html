<!-- @dsCard group="Spacing" viewport="700x160" name="間距與圓角 Spacing & Radius" subtitle="4px 基準 · 圓角 6/10/16" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);display:flex;gap:24px;padding:18px 24px;background:#fff;align-items:flex-end}
.sp{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--text-secondary);font-family:var(--font-mono)}
.bar{width:18px;background:var(--dghm-navy-light);border-radius:3px}
.rad{display:flex;gap:14px;margin-left:auto;align-items:flex-end}
.rb{background:var(--dghm-pale);border:1.5px solid var(--dghm-navy);width:64px;height:64px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--dghm-navy);font-family:var(--font-mono)}
a{color:var(--text-link)}a:hover{color:var(--dghm-navy)}</style></head>
<body>
<div class="sp"><div class="bar" style="height:8px"></div>8</div>
<div class="sp"><div class="bar" style="height:16px"></div>16</div>
<div class="sp"><div class="bar" style="height:24px"></div>24</div>
<div class="sp"><div class="bar" style="height:32px"></div>32</div>
<div class="sp"><div class="bar" style="height:48px"></div>48</div>
<div class="sp"><div class="bar" style="height:64px"></div>64</div>
<div class="rad">
<div class="rb" style="border-radius:6px">sm 6</div>
<div class="rb" style="border-radius:10px">md 10</div>
<div class="rb" style="border-radius:16px">lg 16</div>
</div>
</body></html>
