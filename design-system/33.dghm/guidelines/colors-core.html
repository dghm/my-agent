<!-- @dsCard group="Colors" viewport="700x150" name="核心色 Core Palette" subtitle="深海軍藍 · 暖橘 · 淡藍灰" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);display:flex;gap:12px;padding:16px;background:#fff}
.sw{flex:1;border-radius:var(--radius-md);padding:14px;display:flex;flex-direction:column;justify-content:flex-end;height:86px;border:1px solid var(--dghm-line)}
.n{font-size:13px;font-weight:600}.h{font-size:11px;opacity:.75;font-family:var(--font-mono)}
a{color:var(--text-link)}a:hover{color:var(--dghm-navy)}</style></head>
<body>
<div class="sw" style="background:var(--dghm-navy);color:#fff"><span class="n">深海軍藍</span><span class="h">#0D2F6E</span></div>
<div class="sw" style="background:var(--dghm-orange);color:#fff"><span class="n">暖橘</span><span class="h">#E5622A</span></div>
<div class="sw" style="background:var(--dghm-pale);color:var(--dghm-navy)"><span class="n">淡藍灰</span><span class="h">#F4F7FB</span></div>
</body></html>
