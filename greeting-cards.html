<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>電子賀卡管理 · DGHM 工作台</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="dghm-ui.css?v=20260914-1">
  <link rel="stylesheet" href="app-shell.css?v=20260914-1">
  <link rel="stylesheet" href="greeting-cards/admin.css?v=20260914-4">
</head>
<body data-tool="greeting-cards">
  <div id="tool-workspace" class="gc-page">
      <aside class="gc-editor-column" aria-labelledby="gc-catalog-title">
        <header class="gc-page-head">
          <p class="gc-eyebrow">Marketing · Greeting Cards</p>
          <h1 id="gc-catalog-title">電子賀卡管理</h1>
          <p>選擇檔期與卡片，在右側檢查實際呈現。</p>
        </header>

        <div class="gc-form-panel">
          <div class="gc-field">
            <label for="gc-campaign-select">計畫檔期</label>
            <select id="gc-campaign-select" aria-describedby="gc-catalog-status"></select>
            <p id="gc-catalog-status" class="gc-field-note" role="status">正在讀取…</p>
          </div>

          <div class="gc-list-head">
            <span class="gc-section-label">選擇賀卡</span>
            <span class="gc-planned-note">個人化功能規劃中</span>
          </div>
          <div id="gc-card-list" class="gc-card-list" aria-live="polite"></div>
        </div>

        <footer class="gc-editor-foot">
          <a class="gc-public-link" href="https://cards.dghm.tw/" target="_blank" rel="noopener">開啟 cards.dghm.tw <span>↗</span></a>
        </footer>
      </aside>

      <div class="split-handle" role="separator" aria-orientation="vertical" aria-label="拖曳調整選擇欄寬度" title="拖曳調整選擇欄寬度"></div>

      <section class="gc-preview-column" aria-labelledby="gc-preview-title">
        <div class="gc-panel-head gc-preview-head">
          <div>
            <span class="gc-section-label">即時預覽</span>
            <h2 id="gc-preview-title">選擇一張賀卡</h2>
          </div>
          <div class="gc-device-switch" aria-label="預覽裝置">
            <button type="button" class="is-active" data-gc-device="desktop" aria-pressed="true">桌機</button>
            <button type="button" data-gc-device="mobile" aria-pressed="false">手機</button>
          </div>
        </div>

        <div id="gc-preview-placeholder" class="gc-preview-empty">
          <strong>尚未選擇賀卡</strong>
          <span>從左側選擇一張卡片開始預覽。</span>
        </div>
        <div id="gc-device-frame" class="gc-device-frame" data-device="desktop" hidden>
          <div class="gc-browser-bar" aria-hidden="true"><i></i><i></i><i></i><span id="gc-preview-address"></span></div>
          <iframe id="gc-card-preview" title="賀卡預覽" loading="lazy"></iframe>
        </div>

        <div class="gc-preview-footer">
          <div class="gc-preview-meta">
            <span id="gc-preview-state" class="gc-status">尚未選擇</span>
            <code id="gc-preview-url"></code>
          </div>
          <a id="gc-open-card" href="#" target="_blank" rel="noopener" hidden>另開完整頁面 ↗</a>
        </div>
      </section>
  </div>

  <script src="tool-registry.js?v=20260914-1"></script>
  <script src="project-context.js?v=20260914-1"></script>
  <script src="app-shell.js?v=20260914-1"></script>
  <script>mountAppShell({ activeTool: 'greeting-cards' });</script>
  <script src="dghm-ui.js?v=20260914-1"></script>
  <script>
    initTheme('my-agent-theme');
    initColumnResize({
      page: '.gc-page',
      editor: '.gc-editor-column',
      handle: '.split-handle',
      storageKey: 'dghm-greeting-cards-editor-width'
    });
  </script>
  <script src="greeting-cards/admin.js?v=20260914-4"></script>
</body>
</html>
