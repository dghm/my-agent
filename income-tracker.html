<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DGHM 接案收入登記系統</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="dghm-ui.css?v=20260903-3">
<link rel="stylesheet" href="app-shell.css?v=20260915-1">
<style>
  /* ---- Tool-specific layout ---- */
  .income-page {
    display: flex;
    width: 100%;
    height: 100%;
    min-height: 0;
  }

  .income-editor-column {
    display: flex;
    flex: 0 0 var(--editor-col-width, 500px);
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    border-right: 1px solid var(--surface-border);
    background: var(--surface-panel-bg);
  }

  .income-page-head {
    flex-shrink: 0;
    padding: 22px 20px 18px;
    border-bottom: 1px solid var(--surface-border);
    background: var(--surface-bg);
  }
  .income-eyebrow {
    margin: 0 0 5px;
    color: var(--orange);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .14em;
  }
  .income-page-head h1 { margin: 0 0 5px; font-size: 24px; }
  .income-page-head .hint { margin: 0; font-size: 12px; line-height: 1.55; }

  .form-panel {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 20px;
    background: var(--surface-panel-bg);
  }
  #import-btn { margin-bottom: 16px; }
  .draft-drop-zone {
    display: block; width: 100%; margin-bottom: 16px; padding: 14px 12px;
    border: 1px dashed var(--surface-input-border); background: var(--surface-input-bg);
    color: var(--surface-text-muted); font-size: 12px; line-height: 1.6; text-align: center;
  }
  .draft-drop-zone.is-dragging {
    border-color: var(--orange);
    background: color-mix(in srgb, var(--orange) 10%, var(--surface-input-bg));
    color: var(--navy-text);
  }
  .income-actions { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; }
  .income-actions #import-btn { margin: 0; flex: 1; }
  .income-actions button { font-size: 12px; padding: 6px 10px; }
  #form > fieldset.form-section { overflow: hidden; padding: 0; }
  .form-section-toggle {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    width: 100%; padding: 11px 14px; border: 0; border-radius: 0;
    background: transparent; color: var(--navy-text); font-size: 12px;
    font-weight: 700; text-align: left;
  }
  .form-section-toggle:hover { background: color-mix(in srgb, var(--navy) 6%, var(--surface-panel-bg)); }
  .form-section-content { padding: 0 14px 12px; }
  .form-section-content[hidden] { display: none; }
  textarea { min-height: 50px; }
  .status { margin-top: 8px; font-size: 12px; color: var(--surface-text-muted); min-height: 18px; }

  .main-panel {
    flex: 1;
    min-width: 0;
    overflow-y: auto;
    padding: 24px;
  }
  .records-head { margin: -24px -24px 20px; padding: 22px 24px 18px; border-bottom: 1px solid var(--surface-border); background: var(--surface-bg); }
  .records-head h2 { margin: 0 0 4px; color: var(--navy-text); font-size: 18px; }
  .records-head .hint { margin: 0; font-size: 12px; }
  .summary-bar {
    display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 16px;
  }
  .summary-bar label { font-size: 12px; color: var(--surface-text-muted); margin: 0 0 4px; }
  .summary-bar select, .summary-bar input { width: 140px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card {
    background: var(--surface-panel-bg); border: 1px solid var(--surface-border);
    border-radius: 10px; padding: 14px 16px;
  }
  .card .label { font-size: 12px; color: var(--surface-text-muted); margin-bottom: 6px; }
  .card .value { font-size: 20px; font-weight: 700; color: var(--surface-text); }
  .card.unpaid .value { color: var(--orange); }

  .table-wrap { width: 100%; overflow-x: auto; border-radius: 10px; box-shadow: var(--shadow-sm); }
  table { width: 100%; min-width: 860px; border-collapse: collapse; font-size: 13px; background: var(--surface-panel-bg); overflow: hidden; }
  th { background: var(--navy); color: #fff; padding: 8px 10px; text-align: center; font-size: 12px; }
  td { padding: 8px 10px; border-bottom: 1px solid var(--surface-border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  .status-icon { display: inline-flex; align-items: center; justify-content: center; vertical-align: middle; }
  .status-icon svg { width: 18px; height: 18px; color: #E8ECF5; opacity: .4; }
  .status-icon.is-active svg { color: #E5622A; opacity: 1; }
  .status-icon:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }
  .row-actions { display: flex; gap: 6px; }
  .row-actions button { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; padding: 3px; border: 0; border-radius: 0; background: transparent; box-shadow: none; color: var(--surface-text); }
  .row-actions svg { width: 18px; height: 18px; }
  .row-actions button:hover { background: transparent; }
  .row-actions button:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
  .row-actions button:hover { color: #E5622A; }
  .income-page.is-editor-collapsed > .income-editor-column,
  .income-page.is-editor-collapsed > .split-handle { display: none; }
  .records-title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  .records-title-row h2 { margin: 0; }
  #income-editor-toggle { font-size: 12px; padding: 6px 10px; }
  .empty-row td { text-align: center; color: var(--surface-text-muted); padding: 30px 10px; }
  .attachment-empty { font-size: 12px; color: var(--surface-text-muted); margin-bottom: 8px; }
  .attachment-item {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    padding: 6px 8px; border: 1px solid var(--surface-border); border-radius: 6px; margin-bottom: 6px; font-size: 12px;
  }
  .attachment-item a { color: var(--navy-text); text-decoration: none; word-break: break-all; }
  .attachment-item button { padding: 2px 6px; font-size: 11px; flex-shrink: 0; }

  @media (max-width: 760px) {
    .income-page { display: block; height: auto; min-height: 100%; overflow: auto; }
    .income-editor-column { width: 100%; border-right: 0; border-bottom: 1px solid var(--surface-border); }
    .income-editor-column .form-panel { overflow: visible; }
    .income-page .split-handle { display: none; }
    .main-panel { overflow: visible; padding: 20px; }
    .records-head { margin: -20px -20px 20px; padding: 20px; }
    .income-actions { flex-wrap: wrap; }
  }
</style>
</head>
<body data-tool="income">
<div id="tool-workspace" class="income-page">

  <section class="income-editor-column" id="income-editor" aria-label="收入登記編輯區">
    <header class="income-page-head">
      <p class="income-eyebrow">BUSINESS WORKSPACE</p>
      <h1>收入登記</h1>
      <p class="hint">登記案件收入與收款狀態，右側即時彙整收入並管理歷史紀錄。</p>
    </header>

    <div class="form-panel">
      <div class="form-head">
        <p class="hint">可匯入請款單草稿，或直接填寫本次收入資訊。</p>
      </div>

    <input type="file" id="import-file" accept=".json,application/json" style="display:none">
    <div class="income-actions">
      <button type="button" class="secondary" id="import-btn">匯入請款單 JSON</button>
      <button type="button" class="secondary" id="income-toggle-all" aria-label="全部收合">全部收合</button>
    </div>

    <button type="button" class="draft-drop-zone" id="income-draft-drop">拖曳請款單 JSON 到這裡，或點擊選擇檔案<br>匯入後請確認資料，再按「儲存登記」</button>
    <form id="form">
      <input type="hidden" id="f_id">
      <fieldset>
        <legend>案件資訊</legend>
        <label>案件名稱</label>
        <input type="text" id="f_project" placeholder="查貨系統建置專案">
        <label>客戶名稱</label>
        <input type="text" id="f_client" placeholder="崴宇國際物流有限公司">
        <label>專案代碼</label>
        <input type="text" id="f_project_code" placeholder="DH-01-PJ2">
        <label>本次請款（期數說明）</label>
        <input type="text" id="f_installment" placeholder="第 3 期（20% 尾款）">
      </fieldset>

      <fieldset>
        <legend>金額與稅務</legend>
        <div class="row2">
          <div>
            <label>金額（未稅）</label>
            <input type="number" id="f_amount" placeholder="42000" min="0" step="1">
          </div>
          <div>
            <label>營業稅率（%）</label>
            <input type="number" id="f_tax_rate" placeholder="5" min="0" step="0.1" value="5">
          </div>
        </div>
        <label>含稅總額（自動計算）</label>
        <input type="text" id="f_total_with_tax" readonly>
      </fieldset>

      <fieldset>
        <legend>單號與日期</legend>
        <div class="row2">
          <div>
            <label>通知單號</label>
            <input type="text" id="f_notice_no" placeholder="INV-2605-01">
          </div>
          <div>
            <label>發票號碼</label>
            <input type="text" id="f_invoice_no" placeholder="ZX 33441450">
          </div>
        </div>
        <div class="row2">
          <div>
            <label>開立日期</label>
            <input type="text" id="f_date" placeholder="YYYY/MM/DD" inputmode="numeric" maxlength="10" aria-label="開立日期 YYYY/MM/DD">
          </div>
          <div>
            <label>付款期限</label>
            <input type="text" id="f_due_date" placeholder="YYYY/MM/DD" inputmode="numeric" maxlength="10" aria-label="付款期限 YYYY/MM/DD">
          </div>
        </div>
        <label>付款條件</label>
        <input type="text" id="f_payment_terms" placeholder="Net 30" value="Net 30">
      </fieldset>

      <fieldset>
        <legend>狀態與備註</legend>
        <div class="row2">
          <div>
            <label>收款狀態</label>
            <select id="f_payment_status">
              <option value="unpaid">未收款</option>
              <option value="paid">已收款</option>
            </select>
          </div>
          <div>
            <label>發票狀態</label>
            <select id="f_invoice_status">
              <option value="not_issued">未開立</option>
              <option value="issued">已開立</option>
            </select>
          </div>
        </div>
        <label>備註</label>
        <textarea id="f_note" placeholder="付款方式、合約期間等備註"></textarea>
      </fieldset>

      <fieldset>
        <legend>附件（請款單／發票掃描檔）</legend>
        <div id="attachment-list"></div>
        <input type="file" id="f_attachment_file">
        <button type="button" class="full secondary" id="upload-attachment-btn" disabled>上傳附件</button>
      </fieldset>

      <button type="button" class="full" id="save-btn">儲存登記</button>
      <button type="button" class="full secondary" id="reset-btn">清空表單</button>
    </form>
      <div class="status" id="status" role="status" aria-live="polite">狀態：待命中</div>
    </div>
  </section>

  <div class="split-handle" role="separator" aria-orientation="vertical" aria-label="拖曳調整登記表單寬度" title="拖曳調整登記表單寬度"></div>

  <section class="main-panel" aria-label="收入紀錄與摘要">
    <header class="records-head">
      <div class="records-title-row">
        <h2>收入總覽</h2>
        <button type="button" class="secondary" id="income-editor-toggle" aria-controls="income-editor" aria-expanded="true">收合登記欄</button>
      </div>
      <p class="hint">依年度與月份篩選，查看收款進度或匯出報稅用 CSV。</p>
    </header>
    <div class="summary-bar">
      <div>
        <label>年度</label>
        <select id="filter-year"><option value="">全部</option></select>
      </div>
      <div>
        <label>月份</label>
        <select id="filter-month">
          <option value="">全部</option>
        </select>
      </div>
      <button type="button" class="secondary" id="export-btn">匯出 CSV（報稅用）</button>
    </div>

    <div class="cards">
      <div class="card">
        <div class="label">筆數</div>
        <div class="value" id="sum-count">0</div>
      </div>
      <div class="card">
        <div class="label">總收入</div>
        <div class="value" id="sum-total">NT$ 0</div>
      </div>
      <div class="card">
        <div class="label">已收款</div>
        <div class="value" id="sum-paid">NT$ 0</div>
      </div>
      <div class="card unpaid">
        <div class="label">未收款</div>
        <div class="value" id="sum-unpaid">NT$ 0</div>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>日期</th>
            <th>案件名稱</th>
            <th>客戶</th>
            <th>專案代碼／期數</th>
            <th>金額（含稅）</th>
            <th>收款</th>
            <th>發票</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="list-tbody">
          <tr class="empty-row"><td colspan="8">尚無登記紀錄</td></tr>
        </tbody>
      </table>
    </div>
  </section>

</div>

<script src="tool-registry.js?v=20260903-3"></script>
<script src="project-context.js?v=20260903-3"></script>
<script src="app-shell.js?v=20260915-1"></script>
<script>mountAppShell({ activeTool: 'income' });</script>
<script src="dghm-ui.js?v=20260903-3"></script>
<script>
const API_BASE = "";
let records = [];

initTheme('dghm-income-tracker-theme');
initColumnResize({
  page: '.income-page',
  editor: '.income-editor-column',
  handle: '.split-handle',
  storageKey: 'dghm-income-editor-width'
});

// Keep existing field IDs and handlers intact while matching the invoice editor.
(function initIncomeSections() {
  const sections = [];
  const toggleAll = document.getElementById('income-toggle-all');
  function syncToggle() {
    const collapsed = sections.every(({ content }) => content.hidden);
    toggleAll.textContent = collapsed ? '全部展開' : '全部收合';
    toggleAll.setAttribute('aria-label', toggleAll.textContent);
  }
  function setOpen(section, open) {
    section.content.hidden = !open;
    section.button.setAttribute('aria-expanded', String(open));
    section.indicator.textContent = open ? '-' : '+';
  }
  document.querySelectorAll('#form > fieldset').forEach((fieldset, index) => {
    const legend = fieldset.querySelector('legend');
    const title = legend.textContent;
    legend.remove();
    fieldset.classList.add('form-section');
    fieldset.setAttribute('aria-label', title);
    const content = document.createElement('div');
    content.className = 'form-section-content';
    content.id = 'income-section-' + index;
    while (fieldset.firstChild) content.appendChild(fieldset.firstChild);
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'form-section-toggle';
    button.setAttribute('aria-controls', content.id);
    const label = document.createElement('span');
    label.textContent = title;
    const indicator = document.createElement('span');
    indicator.setAttribute('aria-hidden', 'true');
    button.append(label, indicator);
    fieldset.append(button, content);
    const section = { button, content, indicator };
    sections.push(section);
    setOpen(section, true);
    button.addEventListener('click', () => { setOpen(section, content.hidden); syncToggle(); });
    content.addEventListener('focusin', () => { setOpen(section, true); syncToggle(); });
  });
  toggleAll.addEventListener('click', () => {
    const open = sections.every(({ content }) => content.hidden);
    sections.forEach(section => setOpen(section, open));
    syncToggle();
  });
  syncToggle();
})();

function setStatus(text) {
  document.getElementById('status').textContent = `狀態：${text}`;
}

function fmtNT(n) {
  return 'NT$ ' + Math.round(n || 0).toLocaleString('zh-TW');
}

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function v(id) {
  const value = (document.getElementById(id) || {}).value || '';
  return id === 'f_date' || id === 'f_due_date' ? value.trim().replace(/\//g, '-') : value;
}
function displayIncomeDate(value) {
  return String(value || '').replace(/-/g, '/');
}
function validIncomeDates() {
  return ['f_date', 'f_due_date'].every(id => {
    const date = v(id);
    return !date || /^\d{4}-\d{2}-\d{2}$/.test(date) &&
      !isNaN(Date.parse(date)) && new Date(date).toISOString().slice(0, 10) === date;
  });
}

function clearForm() {
  document.getElementById('f_id').value = '';
  document.getElementById('f_project').value = '';
  document.getElementById('f_client').value = '';
  document.getElementById('f_project_code').value = '';
  document.getElementById('f_installment').value = '';
  document.getElementById('f_amount').value = '';
  document.getElementById('f_tax_rate').value = '5';
  document.getElementById('f_total_with_tax').value = '';
  document.getElementById('f_notice_no').value = '';
  document.getElementById('f_invoice_no').value = '';
  document.getElementById('f_date').value = '';
  document.getElementById('f_due_date').value = '';
  document.getElementById('f_payment_terms').value = 'Net 30';
  document.getElementById('f_payment_status').value = 'unpaid';
  document.getElementById('f_invoice_status').value = 'not_issued';
  document.getElementById('f_note').value = '';
  renderAttachments(null);
}

function updateTotalWithTax() {
  const amount = Number(v('f_amount')) || 0;
  const taxRate = Number(v('f_tax_rate')) || 0;
  const total = amount * (1 + taxRate / 100);
  document.getElementById('f_total_with_tax').value = fmtNT(total);
}

async function loadRecords() {
  setStatus('讀取中...');
  try {
    const res = await fetch(`${API_BASE}/api/income/list`);
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || '讀取失敗');
    records = data.records || [];
    populateFilterOptions();
    renderTable();
    setStatus('就緒');
  } catch (err) {
    setStatus(`讀取失敗：${err.message}（請確認是用 netlify dev 啟動，或已部署到 Netlify）`);
  }
}

function populateFilterOptions() {
  const years = Array.from(new Set(records.map((r) => (r.date || '').split('-')[0]).filter(Boolean))).sort().reverse();
  const yearSelect = document.getElementById('filter-year');
  const currentYear = yearSelect.value;
  yearSelect.innerHTML = '<option value="">全部</option>' + years.map((y) => `<option value="${y}">${y}</option>`).join('');
  yearSelect.value = years.includes(currentYear) ? currentYear : '';

  const monthSelect = document.getElementById('filter-month');
  if (!monthSelect.dataset.init) {
    let opts = '<option value="">全部</option>';
    for (let m = 1; m <= 12; m++) {
      const mm = String(m).padStart(2, '0');
      opts += `<option value="${mm}">${m} 月</option>`;
    }
    monthSelect.innerHTML = opts;
    monthSelect.dataset.init = '1';
  }
}

function getFilteredRecords() {
  const year = v('filter-year');
  const month = v('filter-month');
  return records.filter((r) => {
    if (!r.date) return false;
    const [y, m] = r.date.split('-');
    if (year && y !== year) return false;
    if (month && m !== month) return false;
    return true;
  });
}

// Lucide icons (ISC license), embedded without a runtime CDN dependency.
const incomeStatusIcons = {
  payment: "<path d=\"M11.748 18H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4.875\" /> <path d=\"m16 19 2 2 4-4\" /> <path d=\"M18 12h.01\" /> <path d=\"M6 12h.01\" /> <circle cx=\"12\" cy=\"12\" r=\"2\" />",
  invoice: "<path d=\"M13 16H8\" /> <path d=\"M14 8H8\" /> <path d=\"M16 12H8\" /> <path d=\"M4 3a1 1 0 0 1 1-1 1.3 1.3 0 0 1 .7.2l.933.6a1.3 1.3 0 0 0 1.4 0l.934-.6a1.3 1.3 0 0 1 1.4 0l.933.6a1.3 1.3 0 0 0 1.4 0l.933-.6a1.3 1.3 0 0 1 1.4 0l.934.6a1.3 1.3 0 0 0 1.4 0l.933-.6A1.3 1.3 0 0 1 19 2a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1 1.3 1.3 0 0 1-.7-.2l-.933-.6a1.3 1.3 0 0 0-1.4 0l-.934.6a1.3 1.3 0 0 1-1.4 0l-.933-.6a1.3 1.3 0 0 0-1.4 0l-.933.6a1.3 1.3 0 0 1-1.4 0l-.934-.6a1.3 1.3 0 0 0-1.4 0l-.933.6a1.3 1.3 0 0 1-.7.2 1 1 0 0 1-1-1z\" />"
};
function renderStatusIcon(type, active) {
  const label = type === 'payment' ? (active ? '已收款' : '未收款') : (active ? '已開立發票' : '未開立發票');
  return `<span class="status-icon ${active ? 'is-active' : ''}" role="img" aria-label="${label}" title="${label}" tabindex="0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${incomeStatusIcons[type]}</svg></span>`;
}

const incomeActionIcons = {
  edit: "<path d=\"M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7\" /> <path d=\"M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z\" />",
  export: "<path d=\"M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z\" /> <path d=\"M14 2v5a1 1 0 0 0 1 1h5\" /> <path d=\"M12 18v-6\" /> <path d=\"m9 15 3 3 3-3\" />",

function renderActionIcon(action) {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${incomeActionIcons[action]}</svg>`;
}
const incomeEditorToggle = document.getElementById('income-editor-toggle');
function setIncomeEditorOpen(open) {
  document.getElementById('tool-workspace').classList.toggle('is-editor-collapsed', !open);
  incomeEditorToggle.setAttribute('aria-expanded', String(open));
  incomeEditorToggle.textContent = open ? '收合登記欄' : '展開登記欄';
}
incomeEditorToggle.addEventListener('click', () => {
  setIncomeEditorOpen(incomeEditorToggle.getAttribute('aria-expanded') !== 'true');
});

function renderTable() {
  const filtered = getFilteredRecords().slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const tbody = document.getElementById('list-tbody');

  let total = 0, paid = 0;
  filtered.forEach((r) => {
    total += Number(r.amount) || 0;
    if (r.paymentStatus === 'paid') paid += Number(r.amount) || 0;
  });
  document.getElementById('sum-count').textContent = filtered.length;
  document.getElementById('sum-total').textContent = fmtNT(total);
  document.getElementById('sum-paid').textContent = fmtNT(paid);
  document.getElementById('sum-unpaid').textContent = fmtNT(total - paid);

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="8">尚無登記紀錄</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map((r) => `
    <tr>
      <td>${esc(r.date)}</td>
      <td>${esc(r.project)}</td>
      <td>${esc(r.client)}</td>
      <td>${esc(r.projectCode)}${r.projectCode && r.installment ? '／' : ''}${esc(r.installment)}</td>
      <td>${fmtNT((Number(r.amount) || 0) * (1 + (Number(r.taxRate) || 0) / 100))}</td>
      <td>${renderStatusIcon('payment', r.paymentStatus === 'paid')}</td>
      <td>${renderStatusIcon('invoice', r.invoiceStatus === 'issued')}</td>
      <td>
        <div class="row-actions">
          <button type="button" class="secondary" aria-label="編輯" title="編輯${r.attachments && r.attachments.length ? '（附件 ' + r.attachments.length + ' 份）' : ''}" onclick="editRecord('${r.id}')">${renderActionIcon('edit')}</button>
          <button type="button" class="secondary" aria-label="產生請款單" title="產生請款單" onclick="openInvoice('${r.id}')">${renderActionIcon('export')}</button>
          <button type="button" class="secondary" aria-label="刪除" title="刪除" onclick="deleteRecord('${r.id}')">${renderActionIcon('delete')}</button>
        </div>
      </td>
    </tr>
  `).join('');
}

function editRecord(id) {
  setIncomeEditorOpen(true);
  const r = records.find((x) => x.id === id);
  if (!r) return;
  document.getElementById('f_id').value = r.id;
  document.getElementById('f_project').value = r.project;
  document.getElementById('f_client').value = r.client;
  document.getElementById('f_project_code').value = r.projectCode || '';
  document.getElementById('f_installment').value = r.installment || '';
  document.getElementById('f_amount').value = r.amount;
  document.getElementById('f_tax_rate').value = r.taxRate != null ? r.taxRate : 5;
  document.getElementById('f_notice_no').value = r.noticeNo || '';
  document.getElementById('f_invoice_no').value = r.invoiceNo || '';
  document.getElementById('f_date').value = displayIncomeDate(r.date);
  document.getElementById('f_due_date').value = displayIncomeDate(r.dueDate);
  document.getElementById('f_payment_terms').value = r.paymentTerms || 'Net 30';
  document.getElementById('f_payment_status').value = r.paymentStatus;
  document.getElementById('f_invoice_status').value = r.invoiceStatus;
  document.getElementById('f_note').value = r.note || '';
  updateTotalWithTax();
  renderAttachments(r);
  setStatus(`編輯中：${r.project}`);
}

function renderAttachments(record) {
  const listEl = document.getElementById('attachment-list');
  const uploadBtn = document.getElementById('upload-attachment-btn');

  if (!record || !record.id) {
    listEl.innerHTML = '<p class="attachment-empty">請先儲存登記後才能上傳附件</p>';
    uploadBtn.disabled = true;
    return;
  }

  uploadBtn.disabled = false;
  const attachments = Array.isArray(record.attachments) ? record.attachments : [];
  if (attachments.length === 0) {
    listEl.innerHTML = '<p class="attachment-empty">尚無附件</p>';
    return;
  }

  listEl.innerHTML = attachments.map((a) => `
    <div class="attachment-item">
      <a href="${API_BASE}/api/income/attachment?recordId=${encodeURIComponent(record.id)}&id=${encodeURIComponent(a.id)}" target="_blank">${esc(a.filename)}</a>
      <button type="button" class="secondary" onclick="deleteAttachment('${record.id}', '${a.id}')">刪除</button>
    </div>
  `).join('');
}

async function uploadAttachment() {
  const id = v('f_id');
  if (!id) {
    setStatus('請先儲存登記後才能上傳附件');
    return;
  }
  const fileInput = document.getElementById('f_attachment_file');
  const file = fileInput.files[0];
  if (!file) {
    setStatus('請選擇要上傳的檔案');
    return;
  }

  const uploadBtn = document.getElementById('upload-attachment-btn');
  uploadBtn.disabled = true;
  setStatus('上傳中...');
  try {
    const formData = new FormData();
    formData.append('recordId', id);
    formData.append('file', file);
    const res = await fetch(`${API_BASE}/api/income/attachment-upload`, {
      method: 'POST',
      body: formData,
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || '上傳失敗');

    const index = records.findIndex((r) => r.id === id);
    if (index !== -1) records[index] = data.record;
    fileInput.value = '';
    renderAttachments(data.record);
    setStatus('已上傳附件');
  } catch (err) {
    setStatus(`上傳失敗：${err.message}`);
  } finally {
    uploadBtn.disabled = false;
  }
}

async function deleteAttachment(recordId, attachmentId) {
  if (!confirm('確定要刪除這個附件嗎？')) return;
  setStatus('刪除附件中...');
  try {
    const res = await fetch(`${API_BASE}/api/income/attachment-delete`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ recordId, id: attachmentId }),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || '刪除失敗');

    const index = records.findIndex((r) => r.id === recordId);
    if (index !== -1) records[index] = data.record;
    if (v('f_id') === recordId) renderAttachments(data.record);
    setStatus('已刪除附件');
  } catch (err) {
    setStatus(`刪除失敗：${err.message}`);
  }
}

function openInvoice(id) {
  const r = records.find((x) => x.id === id);
  if (!r) return;
  const params = new URLSearchParams({
    company: r.client || '',
    project: r.project || '',
    amount: r.amount || '',
    date: r.date || '',
    projectCode: r.projectCode || '',
    installment: r.installment || '',
    taxRate: r.taxRate != null ? r.taxRate : 5,
    noticeNo: r.noticeNo || '',
    invoiceNo: r.invoiceNo || '',
    dueDate: r.dueDate || '',
    paymentTerms: r.paymentTerms || 'Net 30',
  });
  window.open(`Invoice-Generator.html?${params.toString()}`, '_blank');
}

async function deleteRecord(id) {
  if (!confirm('確定要刪除這筆登記紀錄嗎？')) return;
  setStatus('刪除中...');
  try {
    const res = await fetch(`${API_BASE}/api/income/delete`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id }),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || '刪除失敗');
    await loadRecords();
    setStatus('已刪除');
  } catch (err) {
    setStatus(`刪除失敗：${err.message}`);
  }
}

async function saveRecord() {
  if (!validIncomeDates()) {
    setStatus('請輸入有效日期，格式為 YYYY/MM/DD');
    return;
  }
  const id = v('f_id');
  const payload = {
    project: v('f_project').trim(),
    client: v('f_client').trim(),
    projectCode: v('f_project_code').trim(),
    installment: v('f_installment').trim(),
    amount: Number(v('f_amount')),
    taxRate: Number(v('f_tax_rate')) || 0,
    noticeNo: v('f_notice_no').trim(),
    invoiceNo: v('f_invoice_no').trim(),
    date: v('f_date'),
    dueDate: v('f_due_date'),
    paymentTerms: v('f_payment_terms').trim(),
    paymentStatus: v('f_payment_status'),
    invoiceStatus: v('f_invoice_status'),
    note: v('f_note').trim(),
  };

  if (!payload.project || !payload.client || !payload.date || !payload.amount) {
    setStatus('請完整填寫案件名稱、客戶、日期與金額');
    return;
  }

  const saveBtn = document.getElementById('save-btn');
  saveBtn.disabled = true;
  setStatus('儲存中...');
  try {
    const url = id ? `${API_BASE}/api/income/update` : `${API_BASE}/api/income/create`;
    const body = id ? { ...payload, id } : payload;
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || '儲存失敗');
    clearForm();
    await loadRecords();
    setStatus('已儲存');
  } catch (err) {
    setStatus(`儲存失敗：${err.message}`);
  } finally {
    saveBtn.disabled = false;
  }
}

function exportCsv() {
  const filtered = getFilteredRecords().slice().sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  if (filtered.length === 0) {
    setStatus('目前篩選範圍內沒有資料可匯出');
    return;
  }
  const header = ['日期', '案件名稱', '客戶', '專案代碼', '期數說明', '金額（未稅）', '稅率(%)', '金額（含稅）', '通知單號', '發票號碼', '付款條件', '付款期限', '收款狀態', '發票狀態', '備註'];
  const rows = filtered.map((r) => [
    r.date,
    r.project,
    r.client,
    r.projectCode || '',
    r.installment || '',
    r.amount,
    r.taxRate != null ? r.taxRate : '',
    Math.round((Number(r.amount) || 0) * (1 + (Number(r.taxRate) || 0) / 100)),
    r.noticeNo || '',
    r.invoiceNo || '',
    r.paymentTerms || '',
    r.dueDate || '',
    r.paymentStatus === 'paid' ? '已收款' : '未收款',
    r.invoiceStatus === 'issued' ? '已開立' : '未開立',
    r.note || '',
  ]);
  const csv = [header, ...rows]
    .map((row) => row.map((cell) => `"${String(cell).replace(/"/g, '""')}"`).join(','))
    .join('\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const year = v('filter-year') || '全部年度';
  const month = v('filter-month') ? `-${v('filter-month')}月` : '';
  a.download = `接案收入登記-${year}${month}.csv`;
  a.click();
  setStatus('已匯出 CSV');
}

function importInvoiceJson(json) {
  const f = json.fields || {};
  const items = Array.isArray(json.items) ? json.items : [];
  const total = items.reduce((sum, it) => sum + (Number(it.price) || 0), 0);
  clearForm();
  document.getElementById('f_project').value = f.f_project_name || '';
  document.getElementById('f_client').value = f.f_company_name || '';
  document.getElementById('f_project_code').value = f.f_proj_code || '';
  document.getElementById('f_installment').value = items.length === 1 ? (items[0].desc || '') : '';
  document.getElementById('f_amount').value = total || '';
  document.getElementById('f_notice_no').value = f.f_inv_no || '';
  document.getElementById('f_invoice_no').value = f.f_inv_number || '';
  document.getElementById('f_date').value = displayIncomeDate(f.f_issue_date);
  document.getElementById('f_due_date').value = displayIncomeDate(f.f_due_date);
  document.getElementById('f_payment_terms').value = f.f_payment_terms || 'Net 30';
  updateTotalWithTax();
}

document.getElementById('import-btn').addEventListener('click', () => {
  document.getElementById('import-file').click();
});
async function importInvoiceFile(file) {
  if (!file) return;
  let json;
  try {
    if (!/\.json$/i.test(file.name)) throw new Error('請選擇 .json 檔案');
    json = JSON.parse(await file.text());
    if (!json || typeof json !== 'object' || Array.isArray(json) ||
        json.fields && (typeof json.fields !== 'object' || Array.isArray(json.fields)) ||
        json.items && (!Array.isArray(json.items) || json.items.some(it => !it || typeof it !== 'object'))) {
      throw new Error('請款單資料結構不正確');
    }
  } catch (err) {
    setStatus(`匯入失敗：檔案不是有效的 JSON（${err.message}）`);
    return;
  }
  // 舊版請款單草稿沒有 kind，以欄位結構判斷
  const check = checkDraftKind(json, 'dghm-invoice-draft', (d) =>
    !!(d.fields && ('f_company_name' in d.fields || 'f_inv_no' in d.fields)) || Array.isArray(d.items)
  );
  if (!check.ok) {
    setStatus(`匯入失敗：${check.reason}`);
    return;
  }
  importInvoiceJson(json);
  setStatus('已匯入請款單資料，請確認金額、稅率與收款／發票狀態後按「儲存登記」');
}
document.getElementById('import-file').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  await importInvoiceFile(file);
});
const incomeDropZone = document.getElementById('income-draft-drop');
incomeDropZone.addEventListener('click', () => document.getElementById('import-file').click());
incomeDropZone.addEventListener('dragover', (e) => {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
  incomeDropZone.classList.add('is-dragging');
});
incomeDropZone.addEventListener('dragleave', (e) => {
  if (!incomeDropZone.contains(e.relatedTarget)) incomeDropZone.classList.remove('is-dragging');
});
incomeDropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  incomeDropZone.classList.remove('is-dragging');
  if (e.dataTransfer.files.length !== 1) {
    setStatus('匯入失敗：請一次拖曳一個請款單 JSON 檔案');
    return;
  }
  importInvoiceFile(e.dataTransfer.files[0]);
});

document.getElementById('f_amount').addEventListener('input', updateTotalWithTax);
document.getElementById('f_tax_rate').addEventListener('input', updateTotalWithTax);
document.getElementById('save-btn').addEventListener('click', saveRecord);
document.getElementById('upload-attachment-btn').addEventListener('click', uploadAttachment);
document.getElementById('reset-btn').addEventListener('click', () => { clearForm(); setStatus('已清空表單'); });
document.getElementById('export-btn').addEventListener('click', exportCsv);
document.getElementById('filter-year').addEventListener('change', renderTable);
document.getElementById('filter-month').addEventListener('change', renderTable);

loadRecords();
</script>
