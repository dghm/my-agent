<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Skill 總覽 — DGHM</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="dghm-ui.css?v=20260727-5">
<link rel="stylesheet" href="app-shell.css?v=20260727-6">
<link rel="stylesheet" href="skill-overview.css?v=20260727-6">
</head>
<body data-tool="skills">
<div id="tool-workspace" class="skill-page">
  <header class="skill-page-head">
    <div>
      <p class="skill-eyebrow">AI WORKSPACE</p>
      <h1>AI Skill 總覽</h1>
      <p>看懂一個 Skill 能做什麼、何時使用，以及會產出什麼結果。</p>
    </div>
    <label class="skill-import-button" for="skill-file">
      <span aria-hidden="true">＋</span> 選擇 .skill
    </label>
    <input id="skill-file" type="file" accept=".skill,application/zip" multiple>
  </header>

  <div id="skill-message" class="skill-message" role="status" aria-live="polite" hidden></div>

  <section class="skill-content" aria-label="Skill 清單與內容">
    <aside class="skill-catalog" aria-labelledby="skill-list-title">
      <div class="skill-section-title">
        <div>
          <span>已開啟</span>
          <h2 id="skill-list-title">Skill 清單</h2>
        </div>
        <span id="skill-count" class="skill-count">0</span>
      </div>
      <div id="skill-list" class="skill-list">
        <div class="skill-empty">
          <strong>尚未加入 Skill</strong>
          <p>請從本機選擇一個 .skill 套件。</p>
        </div>
      </div>
    </aside>

    <article id="skill-detail" class="skill-detail">
      <div class="skill-detail-empty">
        <span aria-hidden="true">✦</span>
        <h2>選擇一個 Skill 查看說明</h2>
        <p>你會在這裡看到用途、使用時機、輸出結果與原始 SKILL.md。</p>
      </div>
    </article>
  </section>
</div>

<script src="tool-registry.js"></script>
<script src="project-context.js"></script>
<script src="app-shell.js"></script>
<script>mountAppShell({ activeTool: 'skills' });</script>
<script src="dghm-ui.js"></script>
<script>initTheme('my-agent-theme');</script>
<script src="skill-overview.js?v=20260727-5"></script>
</body>
</html>
