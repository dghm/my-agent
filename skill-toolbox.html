<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Skill 總覽 — DGHM</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="dghm-ui.css?v=20260903-2">
<link rel="stylesheet" href="app-shell.css?v=20260903-2">
<link rel="stylesheet" href="skill-overview.css?v=20260729-2">
</head>
<body data-tool="skills">
<div id="tool-workspace" class="skill-page">
  <section class="skill-library-column" aria-labelledby="skill-page-title">
    <header class="skill-page-head">
      <p class="skill-eyebrow">AI WORKSPACE</p>
      <h1 id="skill-page-title">AI Skill 總覽</h1>
      <p>從本機加入 Skill，快速看懂用途、使用時機與輸出結果。</p>
    </header>

    <div class="skill-library-body">
      <label class="skill-import-button" for="skill-file">
        <span aria-hidden="true">＋</span> 選擇 .skill
      </label>
      <input id="skill-file" type="file" accept=".skill,application/zip" multiple>

      <div id="skill-message" class="skill-message" role="status" aria-live="polite" hidden></div>

      <div class="skill-section-title">
        <div>
          <span>SKILL LIBRARY</span>
          <h2 id="skill-list-title">Skill 清單</h2>
        </div>
        <span id="skill-count" class="skill-count">0</span>
      </div>
      <div id="skill-list" class="skill-list">
        <div class="skill-empty">
          <strong>尚未加入 Skill</strong>
          <p>請從本機選擇一個 .skill 套件。</p>
        </div>
      </div>
    </div>
  </section>

  <section class="skill-output-panel" aria-label="Skill 內容預覽">
    <article id="skill-detail" class="skill-detail">
      <div class="skill-detail-empty">
        <span aria-hidden="true">✦</span>
        <h2>選擇一個 Skill 查看說明</h2>
        <p>你會在這裡看到用途、使用時機、輸出結果與原始 SKILL.md。</p>
      </div>
    </article>
  </section>
</div>

<script src="tool-registry.js?v=20260903-2"></script>
<script src="project-context.js?v=20260903-2"></script>
<script src="app-shell.js?v=20260903-2"></script>
<script>mountAppShell({ activeTool: 'skills' });</script>
<script src="dghm-ui.js?v=20260903-2"></script>
<script>initTheme('my-agent-theme');</script>
<script src="skill-overview.js?v=20260729-1"></script>
</body>
</html>
