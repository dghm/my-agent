<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>設計素材庫整理</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:680px;margin:80px auto;padding:24px;color:#172033;background:#f6f7fb}
  main{background:#fff;border:1px solid #dde2ea;border-radius:20px;padding:32px;box-shadow:0 12px 40px #18243b12}
  button{border:0;border-radius:12px;background:#173b67;color:#fff;font-weight:700;padding:14px 20px;cursor:pointer}
  button:disabled{opacity:.45} pre{white-space:pre-wrap;background:#f2f4f7;padding:16px;border-radius:12px}
</style>
<main>
  <h1>設計素材庫整理</h1>
  <p>將既有來源資料夾搬入中文分類並重新命名；不刪除、不合併、不更動素材檔案。</p>
  <button id="run">開始整理</button>
  <pre id="result">尚未執行</pre>
</main>
<script>
  const button = document.querySelector('#run');
  const result = document.querySelector('#result');
  button.addEventListener('click', async () => {
    button.disabled = true;
    result.textContent = '正在整理 Google Drive…';
    try {
      const response = await fetch('/api/assets/organize-library', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: '{}',
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
      result.textContent = `完成：已整理 ${data.moved} 個資料夾，根目錄已改名為「${data.rootName}」。`;
    } catch (error) {
      result.textContent = `未完成：${error.message}`;
      button.disabled = false;
    }
  });
</script>
</html>
