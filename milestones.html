<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DGHM 大事紀</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="dghm-ui.css?v=20260903-3">
<link rel="stylesheet" href="app-shell.css?v=20260915-1">
<style>
  .milestones-wrap { max-width: 980px; margin: 0 auto; padding: 38px 26px 64px; }
  .milestones-hero {
    position: relative; overflow: hidden; display: grid;
    grid-template-columns: minmax(0, 1fr) auto; gap: 28px; align-items: end;
    padding: 30px; border-radius: calc(var(--radius) + 5px);
    background:
      radial-gradient(circle at 88% 8%, rgba(230, 111, 57, .24), transparent 31%),
      var(--navy);
    color: #fff; box-shadow: var(--shadow-md);
  }
  .milestones-kicker {
    display: block; margin-bottom: 9px; color: #F5A071;
    font-size: 11px; font-weight: 900; letter-spacing: .15em;
  }
  .milestones-hero h1 { margin: 0 0 9px; color: #fff; font-size: clamp(28px, 4vw, 42px); line-height: 1.08; }
  .milestones-hero p { max-width: 560px; margin: 0; color: rgba(255,255,255,.72); font-size: 13px; line-height: 1.7; }
  .milestones-add {
    display: inline-flex; align-items: center; gap: 8px; padding: 10px 15px;
    border: 0; border-radius: var(--radius-xs); background: var(--orange); color: #fff;
    font: inherit; font-size: 13px; font-weight: 800; white-space: nowrap; cursor: pointer;
  }
  .milestones-toolbar {
    display: flex; justify-content: space-between; align-items: center; gap: 18px;
    margin: 24px 0 18px;
  }
  .year-switcher {
    display: flex; align-items: center; gap: 10px; padding: 5px;
    border-radius: 999px; background: var(--surface-panel-bg); box-shadow: var(--shadow-sm);
  }
  .year-switcher button {
    width: 34px; height: 34px; padding: 0; border: 0; border-radius: 50%;
    background: transparent; color: var(--navy-text); font: inherit; font-weight: 800; cursor: pointer;
  }
  .year-switcher button:hover { background: var(--surface-bg); }
  .year-switcher button:disabled { opacity: .3; cursor: default; }
  .year-label { min-width: 82px; color: var(--navy-text); font-size: 15px; font-weight: 900; text-align: center; }
  .year-summary { color: var(--surface-text-muted); font-size: 12px; }
  .sync-state { margin-left: 5px; color: var(--orange); }

  .timeline { position: relative; display: grid; gap: 22px; }
  .timeline::before {
    content: ''; position: absolute; top: 14px; bottom: 18px; left: 41px;
    width: 1px; background: linear-gradient(var(--orange), var(--surface-border) 18%, var(--surface-border) 82%, transparent);
  }
  .month-group { position: relative; display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 18px; }
  .month-label {
    position: relative; z-index: 1; align-self: start; padding-top: 2px;
    color: var(--orange); font-size: 12px; font-weight: 900; text-align: center;
  }
  .month-label strong {
    display: grid; place-items: center; width: 46px; height: 46px; margin: 0 auto 5px;
    border: 1px solid rgba(230,111,57,.35); border-radius: 50%;
    background: var(--surface-panel-bg); color: var(--navy-text); font-size: 11px;
    letter-spacing: .06em;
    box-shadow: var(--shadow-sm);
  }
  .month-block {
    min-width: 0; overflow: hidden; border: 1px solid var(--surface-border);
    border-radius: var(--radius); background: var(--surface-panel-bg); box-shadow: var(--shadow-sm);
  }
  .month-summary {
    position: relative; display: grid; width: 100%; gap: 10px; padding: 16px 104px 16px 18px;
    border: 0; border-radius: 0; background: transparent; color: inherit; text-align: left;
    cursor: pointer;
  }
  .month-summary:hover { background: rgba(230,111,57,.035); }
  .month-summary[aria-expanded="true"] { border-bottom: 1px solid var(--surface-border); }
  .month-count {
    position: absolute; top: 50%; right: 46px; display: inline-flex; align-items: baseline; gap: 2px;
    color: var(--navy-text); transform: translateY(-50%); font-variant-numeric: tabular-nums;
  }
  .month-count strong { font-size: 26px; line-height: 1; }
  .month-count small { color: var(--surface-text-muted); font-size: 9px; font-weight: 800; }
  .month-title-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .month-title-chip {
    display: inline-flex; max-width: 100%; padding: 3px 8px; border-radius: 999px;
    background: var(--surface-bg); color: var(--surface-text-muted); font-size: 10px; line-height: 1.45;
  }
  .month-title-chip.is-focus { background: var(--orange); color: #fff; font-weight: 800; }
  .month-chevron {
    position: absolute; top: 50%; right: 18px; color: var(--surface-text-muted);
    font-size: 15px; transform: translateY(-50%) rotate(0deg); transition: transform .18s ease;
  }
  .month-summary[aria-expanded="true"] .month-chevron { transform: translateY(-50%) rotate(180deg); }
  .month-events { display: grid; gap: 10px; padding: 12px; background: var(--surface-bg); }
  .month-events[hidden] { display: none; }
  .milestone-card {
    display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 14px; align-items: center;
    padding: 17px 18px; border: 1px solid var(--surface-border); border-radius: var(--radius);
    background: var(--surface-panel-bg); box-shadow: none;
    transition: transform .16s ease, box-shadow .16s ease;
  }
  .milestone-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
  .milestone-date {
    display: grid; place-items: center; color: var(--navy-text);
    font-size: 21px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums;
  }
  .milestone-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-bottom: 5px; }
  .milestone-meta:empty { display: none; }
  .milestone-category {
    display: inline-flex; padding: 2px 7px; border-radius: 999px;
    background: var(--surface-bg); color: var(--surface-text-muted); font-size: 9px; font-weight: 800;
  }
  .milestone-content h2 { margin: 0 0 5px; color: var(--navy-text); font-size: 15px; line-height: 1.45; }
  .milestone-content p { margin: 0; color: var(--surface-text-muted); font-size: 12px; line-height: 1.65; }
  .milestone-actions { display: flex; flex-direction: column; align-items: flex-end; align-self: center; gap: 6px; }
  .milestone-actions button {
    padding: 3px 0; border: 0; background: transparent; color: var(--surface-text-muted);
    font: inherit; font-size: 10px; font-weight: 700; white-space: nowrap; cursor: pointer;
  }
  .milestone-actions .icon-action {
    display: grid; place-items: center; width: 26px; height: 26px; padding: 0;
    border-radius: 7px;
  }
  .milestone-actions .icon-action:hover { background: var(--surface-bg); }
  .milestone-actions .icon-action svg { width: 15px; height: 15px; stroke-width: 1.8; }
  .milestone-actions button:hover { color: var(--orange); }
  .milestone-actions .set-focus { color: var(--navy-text); }
  .empty-state {
    padding: 56px 24px; border: 1px dashed var(--surface-border); border-radius: var(--radius);
    background: var(--surface-panel-bg); text-align: center;
  }
  .empty-state strong { display: block; margin-bottom: 8px; color: var(--navy-text); font-size: 17px; }
  .empty-state p { margin: 0 0 17px; color: var(--surface-text-muted); font-size: 12px; line-height: 1.7; }

  .milestone-dialog {
    width: min(560px, calc(100vw - 32px)); padding: 0; overflow: hidden;
    border: 1px solid var(--surface-border); border-radius: calc(var(--radius) + 4px);
    background: var(--surface-panel-bg); color: var(--surface-text);
    box-shadow: 0 24px 80px rgba(9,28,67,.3);
  }
  .milestone-dialog::backdrop { background: rgba(9,28,67,.58); backdrop-filter: blur(3px); }
  .dialog-inner { padding: 24px; }
  .dialog-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 18px; }
  .dialog-head h2 { margin: 3px 0 0; color: var(--navy-text); font-size: 20px; }
  .dialog-close {
    display: grid; place-items: center; width: 32px; height: 32px; padding: 0;
    border: 0; border-radius: 50%; background: var(--surface-bg); color: var(--surface-text-muted);
    font: inherit; font-size: 18px; cursor: pointer;
  }
  .milestone-form { display: grid; gap: 13px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .milestone-form label { display: grid; gap: 6px; color: var(--surface-text-muted); font-size: 11px; font-weight: 700; }
  .milestone-form input, .milestone-form select, .milestone-form textarea {
    width: 100%; box-sizing: border-box; padding: 10px 11px;
    border: 1px solid var(--surface-border); border-radius: var(--radius-xs);
    background: var(--surface-bg); color: var(--surface-text); font: inherit; font-size: 13px;
  }
  .milestone-form select { cursor: pointer; }
  .milestone-form [hidden] { display: none; }
  .milestone-form textarea { min-height: 90px; resize: vertical; }
  .focus-check { display: flex !important; grid-template-columns: none; flex-direction: row; align-items: center; gap: 8px !important; }
  .focus-check input { width: auto; }
  .form-message { min-height: 18px; margin: 0; color: #C0392B; font-size: 11px; }
  .form-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .form-actions button { padding: 8px 13px; border: 0; border-radius: var(--radius-xs); font: inherit; font-size: 12px; font-weight: 800; cursor: pointer; }
  .save-button { background: var(--navy); color: #fff; }
  .cancel-button { background: var(--surface-bg); color: var(--surface-text-muted); }

  @media (max-width: 680px) {
    .milestones-wrap { padding: 24px 18px 46px; }
    .milestones-hero { grid-template-columns: 1fr; padding: 24px; }
    .milestones-add { justify-self: start; }
    .milestones-toolbar { align-items: flex-start; flex-direction: column; }
    .timeline::before { left: 22px; }
    .month-group { grid-template-columns: 46px minmax(0, 1fr); gap: 10px; }
    .month-label strong { width: 40px; height: 40px; font-size: 10px; }
    .milestone-card { grid-template-columns: 42px minmax(0, 1fr) auto; }
    .month-summary { padding: 14px 88px 14px 14px; }
    .month-count { right: 40px; }
    .month-count strong { font-size: 23px; }
    .month-chevron { right: 13px; }
  }
  @media (max-width: 460px) {
    .form-row { grid-template-columns: 1fr; }
    .milestone-card { grid-template-columns: 42px minmax(0, 1fr); padding: 15px 14px; }
    .milestone-actions { grid-column: 2; flex-direction: row; flex-wrap: wrap; justify-content: flex-start; }
  }
</style>
</head>
<body data-tool="milestones">
<div id="tool-workspace">
  <main class="milestones-wrap">
    <section class="milestones-hero">
      <div>
        <span class="milestones-kicker">DGHM YEAR IN REVIEW</span>
        <h1>大事紀</h1>
        <p>記下真正值得回頭看的成果。這裡沒有完成率，也不要求每個月都留下紀錄。</p>
      </div>
      <button class="milestones-add" id="add-milestone" type="button"><span aria-hidden="true">＋</span> 新增大事紀</button>
    </section>

    <div class="milestones-toolbar">
      <div class="year-switcher" aria-label="切換年份">
        <button id="previous-year" type="button" aria-label="上一年">←</button>
        <span class="year-label" id="year-label"></span>
        <button id="next-year" type="button" aria-label="下一年">→</button>
      </div>
      <div class="year-summary"><span id="year-summary">讀取中…</span><span class="sync-state" id="sync-state"></span></div>
    </div>

    <section class="timeline" id="milestone-timeline" aria-live="polite">
      <div class="empty-state"><strong>正在整理這一年的足跡</strong><p>請稍候一下。</p></div>
    </section>
  </main>
</div>

<dialog class="milestone-dialog" id="milestone-dialog" aria-labelledby="milestone-dialog-title">
  <div class="dialog-inner">
    <div class="dialog-head">
      <div>
        <span class="milestones-kicker">MILESTONE</span>
        <h2 id="milestone-dialog-title">新增大事紀</h2>
      </div>
      <button class="dialog-close" id="dialog-close" type="button" aria-label="關閉">×</button>
    </div>
    <form class="milestone-form" id="milestone-form">
      <input id="milestone-id" type="hidden">
      <div class="form-row">
        <label>日期
          <input id="milestone-date" type="date" required>
        </label>
        <label>分類（選填）
          <select id="milestone-category"></select>
          <input id="milestone-category-new" type="text" maxlength="30" placeholder="輸入新分類名稱" hidden>
        </label>
      </div>
      <label>值得記住的事情
        <input id="milestone-title" type="text" maxlength="80" required placeholder="例如：中秋卡片寄送及送禮">
      </label>
      <label>想留給自己的話（選填）
        <textarea id="milestone-note" maxlength="300" placeholder="當時完成了什麼？為什麼值得記住？"></textarea>
      </label>
      <label class="focus-check">
        <input id="milestone-focus" type="checkbox">
        設為該月份的首頁焦點
      </label>
      <p class="form-message" id="form-message"></p>
      <div class="form-actions">
        <button class="cancel-button" id="form-cancel" type="button">取消</button>
        <button class="save-button" id="form-save" type="submit">保存大事紀</button>
      </div>
    </form>
  </div>
</dialog>

<script src="tool-registry.js?v=20260903-3"></script>
<script src="project-context.js?v=20260903-3"></script>
<script src="app-shell.js?v=20260915-1"></script>
<script>mountAppShell({ activeTool: 'milestones' });</script>
<script src="dghm-ui.js?v=20260903-3"></script>
<script>
initTheme('my-agent-theme');

(function () {
  'use strict';

  var CACHE_KEY = 'dghm-milestones-cache-v1';
  var LEGACY_CACHE_KEY = 'dghm-monthly-footprints-cache-v1';
  var DEFAULT_CATEGORIES = ['專案', '品牌', '營運', '系統', '行政', '財務', '客戶'];
  var NEW_CATEGORY_VALUE = '__new__';
  var currentYear = Number(taipeiDate().slice(0, 4));
  var records = [];
  var usingLocalMode = false;
  var expandedMonths = {};

  function taipeiDate() {
    return new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit'
    }).format(new Date());
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function readCache() {
    var cached = [];
    try { cached = JSON.parse(localStorage.getItem(CACHE_KEY) || '[]') || []; } catch (error) {}
    try {
      var legacy = JSON.parse(localStorage.getItem(LEGACY_CACHE_KEY) || '{}') || {};
      Object.keys(legacy).forEach(function (month) {
        var item = legacy[month];
        var id = 'local-' + month;
        if (!item?.title || cached.some(function (record) { return record.id === id; })) return;
        cached.push({
          id: id,
          date: month + '-01',
          month: month,
          title: item.title,
          note: item.note || '',
          category: '',
          isFocus: true,
          createdAt: item.updatedAt || new Date().toISOString(),
          updatedAt: item.updatedAt || new Date().toISOString(),
          pendingSync: true
        });
      });
      localStorage.setItem(CACHE_KEY, JSON.stringify(cached));
      localStorage.removeItem(LEGACY_CACHE_KEY);
    } catch (error) {}
    return cached;
  }

  function writeCache(nextRecords) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(nextRecords)); } catch (error) {}
  }

  function updateCachedRecord(record, pendingSync) {
    var cached = readCache().filter(function (item) { return item.id !== record.id; });
    cached.push(Object.assign({}, record, { pendingSync: !!pendingSync }));
    writeCache(cached);
  }

  function removeCachedRecord(id) {
    writeCache(readCache().filter(function (item) { return item.id !== id; }));
  }

  async function apiRequest(url, options) {
    var response = await fetch(url, Object.assign({ credentials: 'same-origin', cache: 'no-store' }, options || {}));
    var data = await response.json().catch(function () { return {}; });
    if (!response.ok) {
      var error = new Error(data.error || '目前無法連線');
      error.status = response.status;
      throw error;
    }
    return data;
  }

  function monthAbbr(month) {
    var labels = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
    return labels[Number(month.slice(5, 7)) - 1] || '';
  }

  function render() {
    var timeline = document.getElementById('milestone-timeline');
    var yearRecords = records
      .filter(function (record) { return record.month?.slice(0, 4) === String(currentYear); })
      .sort(function (a, b) { return b.date.localeCompare(a.date); });
    document.getElementById('year-label').textContent = currentYear + ' 年';
    document.getElementById('next-year').disabled = currentYear >= Number(taipeiDate().slice(0, 4));
    document.getElementById('year-summary').textContent = yearRecords.length
      ? '這一年留下 ' + yearRecords.length + ' 件值得記住的事'
      : '這一年還沒有留下紀錄';
    document.getElementById('sync-state').textContent = usingLocalMode ? '・本機暫存' : '';

    if (!yearRecords.length) {
      timeline.innerHTML = '<div class="empty-state"><strong>這一年還是空白的</strong>' +
        '<p>不用補進度。等完成真正值得記住的事，再留下第一筆就好。</p>' +
        '<button class="milestones-add" type="button" data-action="add">新增第一筆大事紀</button></div>';
      return;
    }

    var groups = {};
    yearRecords.forEach(function (record) {
      if (!groups[record.month]) groups[record.month] = [];
      groups[record.month].push(record);
    });
    timeline.innerHTML = Object.keys(groups).sort().reverse().map(function (month) {
      var isExpanded = Object.prototype.hasOwnProperty.call(expandedMonths, month)
        ? expandedMonths[month]
        : month === taipeiDate().slice(0, 7);
      var titleList = groups[month].map(function (record) {
        return '<span class="month-title-chip' + (record.isFocus ? ' is-focus' : '') + '">' +
          escapeHtml(record.title) + '</span>';
      }).join('');
      var cards = groups[month].map(function (record) {
        var day = Number(record.date.slice(8, 10));
        var category = record.category ? '<span class="milestone-category">' + escapeHtml(record.category) + '</span>' : '';
        var note = record.note ? '<p>' + escapeHtml(record.note) + '</p>' : '';
        var focusAction = record.isFocus ? '' : '<button class="set-focus" type="button" data-action="focus" data-id="' + record.id + '">設為本月焦點</button>';
        return '<article class="milestone-card">' +
          '<div class="milestone-date">' + day + '</div>' +
          '<div class="milestone-content"><div class="milestone-meta">' + category + '</div>' +
            '<h2>' + escapeHtml(record.title) + '</h2>' + note + '</div>' +
          '<div class="milestone-actions">' + focusAction +
            '<button class="icon-action" type="button" data-action="edit" data-id="' + record.id + '" aria-label="編輯" title="編輯">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></svg></button>' +
            '<button class="icon-action" type="button" data-action="delete" data-id="' + record.id + '" aria-label="刪除" title="刪除">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg></button></div>' +
        '</article>';
      }).join('');
      return '<section class="month-group"><div class="month-label"><strong>' + monthAbbr(month) + '</strong></div>' +
        '<div class="month-block"><button class="month-summary" type="button" data-action="toggle-month" data-month="' + month +
          '" aria-expanded="' + isExpanded + '" aria-controls="month-events-' + month + '">' +
          '<span class="month-title-list">' + titleList + '</span><span class="month-count"><strong>' + groups[month].length +
          '</strong><small>件</small></span><span class="month-chevron" aria-hidden="true">⌄</span></button>' +
        '<div class="month-events" id="month-events-' + month + '"' + (isExpanded ? '' : ' hidden') + '>' + cards + '</div></div></section>';
    }).join('');
  }

  async function loadYear() {
    usingLocalMode = false;
    try {
      await syncPendingRecords(currentYear);
      var data = await apiRequest('/api/milestones?year=' + currentYear);
      records = data.milestones;
      records.forEach(function (record) { updateCachedRecord(record, false); });
    } catch (error) {
      usingLocalMode = true;
      records = readCache();
    }
    render();
  }

  function populateCategoryOptions(selectedCategory) {
    var select = document.getElementById('milestone-category');
    var categories = DEFAULT_CATEGORIES.concat(records, readCache()).reduce(function (list, item) {
      var category = typeof item === 'string' ? item : item?.category;
      category = String(category || '').trim();
      if (category && category !== NEW_CATEGORY_VALUE && !list.includes(category)) list.push(category);
      return list;
    }, []);
    select.textContent = '';
    [['', '未分類']].concat(categories.map(function (category) { return [category, category]; }), [
      [NEW_CATEGORY_VALUE, '＋ 新增分類']
    ]).forEach(function (entry) {
      var option = document.createElement('option');
      option.value = entry[0];
      option.textContent = entry[1];
      select.appendChild(option);
    });
    select.value = selectedCategory || '';
  }

  function updateNewCategoryInput() {
    var select = document.getElementById('milestone-category');
    var input = document.getElementById('milestone-category-new');
    var isAdding = select.value === NEW_CATEGORY_VALUE;
    input.hidden = !isAdding;
    if (!isAdding) input.value = '';
    if (isAdding) input.focus();
  }

  function openForm(record) {
    var dialog = document.getElementById('milestone-dialog');
    var isEdit = !!record;
    document.getElementById('milestone-dialog-title').textContent = isEdit ? '編輯大事紀' : '新增大事紀';
    document.getElementById('milestone-id').value = record?.id || '';
    document.getElementById('milestone-date').value = record?.date || taipeiDate();
    populateCategoryOptions(record?.category || '');
    document.getElementById('milestone-category-new').value = '';
    updateNewCategoryInput();
    document.getElementById('milestone-title').value = record?.title || '';
    document.getElementById('milestone-note').value = record?.note || '';
    document.getElementById('milestone-focus').checked = record?.isFocus || false;
    document.getElementById('form-message').textContent = '';
    if (typeof dialog.showModal === 'function') dialog.showModal();
    else dialog.setAttribute('open', '');
    document.getElementById('milestone-title').focus();
  }

  function closeForm() {
    var dialog = document.getElementById('milestone-dialog');
    if (typeof dialog.close === 'function') dialog.close();
    else dialog.removeAttribute('open');
  }

  function localSave(payload) {
    var now = new Date().toISOString();
    var existing = records.find(function (record) { return record.id === payload.id; });
    var id = payload.id || 'local-' + Date.now().toString(36);
    var month = payload.date.slice(0, 7);
    var clearedRecords = [];
    if (payload.isFocus) {
      records = records.map(function (record) {
        if (record.month !== month || record.id === id || !record.isFocus) return record;
        var cleared = Object.assign({}, record, { isFocus: false });
        clearedRecords.push(cleared);
        return cleared;
      });
    }
    var record = Object.assign({}, existing || {}, payload, {
      id: id,
      month: month,
      createdAt: existing?.createdAt || now,
      updatedAt: now,
      pendingSync: true
    });
    records = records.filter(function (item) { return item.id !== id; });
    records.push(record);
    clearedRecords.forEach(function (item) { updateCachedRecord(item, item.pendingSync); });
    updateCachedRecord(record, true);
    return record;
  }

  async function syncPendingRecords(year) {
    var pending = readCache().filter(function (record) {
      return record.pendingSync && record.month?.slice(0, 4) === String(year);
    });
    for (const record of pending) {
      var isLocal = record.id.startsWith('local-');
      var data = await apiRequest('/api/milestones', {
        method: isLocal ? 'POST' : 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(record)
      });
      if (isLocal) removeCachedRecord(record.id);
      updateCachedRecord(data.milestone, false);
    }
  }

  async function saveRecord(event) {
    event.preventDefault();
    var saveButton = document.getElementById('form-save');
    var message = document.getElementById('form-message');
    var id = document.getElementById('milestone-id').value;
    var categorySelect = document.getElementById('milestone-category');
    var category = categorySelect.value === NEW_CATEGORY_VALUE
      ? document.getElementById('milestone-category-new').value.trim()
      : categorySelect.value;
    if (categorySelect.value === NEW_CATEGORY_VALUE && !category) {
      message.textContent = '請輸入新分類名稱';
      document.getElementById('milestone-category-new').focus();
      return;
    }
    var payload = {
      id: id,
      date: document.getElementById('milestone-date').value,
      category: category,
      title: document.getElementById('milestone-title').value.trim(),
      note: document.getElementById('milestone-note').value.trim(),
      isFocus: document.getElementById('milestone-focus').checked
    };
    if (!payload.date || !payload.title) return;
    saveButton.disabled = true;
    saveButton.textContent = '保存中…';
    message.textContent = '';
    try {
      var data = await apiRequest('/api/milestones', {
        method: id && !id.startsWith('local-') ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (id && id.startsWith('local-')) removeCachedRecord(id);
      updateCachedRecord(data.milestone, false);
      usingLocalMode = false;
    } catch (error) {
      localSave(payload);
      usingLocalMode = true;
    } finally {
      saveButton.disabled = false;
      saveButton.textContent = '保存大事紀';
    }
    closeForm();
    currentYear = Number(payload.date.slice(0, 4));
    await loadYear();
  }

  async function setFocus(record) {
    var payload = Object.assign({}, record, { isFocus: true });
    try {
      var isLocal = record.id.startsWith('local-');
      var data = await apiRequest('/api/milestones', {
        method: isLocal ? 'POST' : 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (isLocal) removeCachedRecord(record.id);
      updateCachedRecord(data.milestone, false);
    } catch (error) {
      localSave(payload);
    }
    await loadYear();
  }

  async function deleteRecord(record) {
    if (!window.confirm('要刪除「' + record.title + '」嗎？')) return;
    if (!record.id.startsWith('local-')) {
      try {
        await apiRequest('/api/milestones?id=' + encodeURIComponent(record.id), { method: 'DELETE' });
      } catch (error) {
        window.alert('目前無法連線，這筆雲端大事紀尚未刪除。請恢復連線後再試一次。');
        return;
      }
    }
    records = records.filter(function (item) { return item.id !== record.id; });
    removeCachedRecord(record.id);
    render();
  }

  document.getElementById('add-milestone').addEventListener('click', function () { openForm(null); });
  document.getElementById('previous-year').addEventListener('click', function () { currentYear -= 1; loadYear(); });
  document.getElementById('next-year').addEventListener('click', function () {
    if (currentYear >= Number(taipeiDate().slice(0, 4))) return;
    currentYear += 1;
    loadYear();
  });
  document.getElementById('dialog-close').addEventListener('click', closeForm);
  document.getElementById('form-cancel').addEventListener('click', closeForm);
  document.getElementById('milestone-category').addEventListener('change', updateNewCategoryInput);
  document.getElementById('milestone-form').addEventListener('submit', saveRecord);
  document.getElementById('milestone-timeline').addEventListener('click', function (event) {
    var button = event.target.closest('[data-action]');
    if (!button) return;
    if (button.dataset.action === 'add') return openForm(null);
    if (button.dataset.action === 'toggle-month') {
      expandedMonths[button.dataset.month] = button.getAttribute('aria-expanded') !== 'true';
      render();
      return;
    }
    var record = records.find(function (item) { return item.id === button.dataset.id; });
    if (!record) return;
    if (button.dataset.action === 'edit') openForm(record);
    if (button.dataset.action === 'focus') setFocus(record);
    if (button.dataset.action === 'delete') deleteRecord(record);
  });

  loadYear();
})();
</script>
</body>
</html>
