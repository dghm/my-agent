<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DGHM 文件表單產生器</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="dghm-ui.css?v=20260903-3">
<link rel="stylesheet" href="app-shell.css?v=20260915-1">
<style>
  :root { --tool-panel: #fff; --tool-tab: #fff; }
  :root[data-theme="dark"] { --tool-panel: #1f2530; --tool-tab: #2a313d; }
  * { box-sizing: border-box; }
  .document-page { display: flex; width: 100%; height: 100%; min-height: 0; }
  .editor-column {
    display: flex; flex: 0 0 var(--editor-col-width, 500px); flex-direction: column;
    min-width: 0; min-height: 0; border-right: 1px solid var(--surface-border);
    background: var(--surface-panel-bg);
  }
  .page-head { flex-shrink: 0; padding: 22px 20px 18px; border-bottom: 1px solid var(--surface-border); background: var(--surface-bg); }
  .eyebrow { margin: 0 0 5px; color: var(--orange); font-size: 10px; font-weight: 800; letter-spacing: .14em; }
  .page-head h1 { margin: 0 0 5px; color: var(--navy-text); font-size: 24px; }
  .page-head .hint { margin: 0; font-size: 12px; line-height: 1.55; }
  .form-panel { flex: 1; min-height: 0; overflow-y: auto; padding: 20px; background: var(--surface-panel-bg); }
  .form-head { margin-bottom: 14px; }
  .form-head .hint { margin: 0; font-size: 12px; line-height: 1.55; }
  .form-panel label { font-size: 13px; }
  .field-note { display: block; margin-top: 4px; color: var(--surface-text-muted); font-size: 11px; font-weight: 400; }
  .form-panel textarea { min-height: 54px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .draft-actions { display: flex; align-items: center; gap: 8px; margin: 0 0 16px; flex-wrap: wrap; }
  .draft-actions button { display: inline-flex; align-items: center; gap: 7px; padding: 6px 10px; font-size: 12px; }
  .draft-actions .draft-status { color: var(--surface-text-muted); font-size: 12px; white-space: nowrap; }
  .draft-actions #accordion-toggle-all { width: 32px; height: 32px; margin-left: auto; padding: 6px; justify-content: center; }
  .action-icon { display: inline-block; flex: 0 0 16px; width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #document-form > fieldset.form-section { overflow: hidden; padding: 0; }
  .form-section-header { width: 100%; }
  .form-section-toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 11px 14px; border: 0; border-radius: 0; background: transparent; color: var(--navy-text); font-size: 12px; font-weight: 700; text-align: left; }
  .form-section-toggle:hover { background: color-mix(in srgb, var(--navy) 6%, var(--surface-panel-bg)); }
  .form-section-toggle .section-chevron { transition: transform .18s ease; }
  .form-section.is-collapsed .section-chevron { transform: rotate(180deg); }
  .form-section-content { padding: 0 14px 12px; }
  .form-section.is-collapsed .form-section-content { display: none; }
  .section-list { margin-top: 10px; }
  .section-block { padding: 0 0 10px; margin: 0 0 10px; border: 0; border-bottom: 1px solid var(--surface-border); border-radius: 0; background: transparent; }
  .section-block:first-child { padding-top: 0; }
  .section-block:last-child { margin-bottom: 8px; }
  .section-block-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding: 7px 8px; border: 1px solid var(--surface-border); border-left: 3px solid var(--orange); border-radius: 6px; background: color-mix(in srgb, var(--navy) 5%, var(--surface-panel-bg)); }
  .section-block-toggle { display: flex; flex: 1; align-items: center; gap: 8px; min-width: 0; padding: 0; border: 0; background: transparent; color: var(--surface-text); text-align: left; }
  .section-block-toggle:hover { background: transparent; color: var(--navy-text); }
  .section-block-tag { flex-shrink: 0; padding: 2px 7px; border: 1px solid var(--navy); border-radius: 4px; background: var(--navy); color: #fff; font-size: 11px; font-weight: 700; }
  .section-block-summary { overflow: hidden; color: var(--navy-text); font-size: 13px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
  .section-block-chevron { margin-left: auto; transition: transform .18s ease; }
  .section-block.is-collapsed .section-block-chevron { transform: rotate(180deg); }
  .section-block.is-collapsed .section-block-head { margin-bottom: 0; }
  .section-block.is-collapsed .section-block-content { display: none; }
  .term-row { display: grid; grid-template-columns: 1fr 30px; gap: 6px; align-items: start; margin-bottom: 6px; }
  .term-row textarea { min-height: 48px; margin: 0; }
  .page-pick { display: flex; align-items: center; gap: 5px; color: var(--surface-text-muted); font-size: 11px; }
  .page-pick input { width: 44px; padding: 3px 4px; font-size: 12px; text-align: center; }
  .icon-delete { width: 30px; height: 30px; padding: 0; border: 0; background: transparent; color: var(--surface-text-muted); font-size: 18px; }
  .icon-delete:hover { color: #c0392b; }
  .items-table { width: 100%; margin: 10px 0 6px; border-collapse: collapse; font-size: .82rem; }
  .items-table th { padding: 5px 6px; background: var(--navy); color: #fff; font-size: .68rem; text-align: left; }
  .items-table td { padding: 4px; border-bottom: 1px solid var(--surface-border); vertical-align: middle; }
  .items-table input, .items-table textarea { min-height: 30px; margin: 0; padding: 4px 6px; border-radius: 4px; font-family: inherit; font-size: 12px; line-height: 1.4; }
  .items-table .cell-delete { width: 30px; text-align: center; }
  .btn-add { width: 100%; padding: 8px 12px; border: 1px dashed var(--surface-input-border); background: transparent; color: var(--surface-text-muted); }
  .btn-add:hover { border-color: var(--navy-text); color: var(--navy-text); }
  .btn-add.small { width: auto; padding: 4px 10px; font-size: 12px; }
  .split-handle { flex: 0 0 7px; }
  .output-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; padding: 20px; overflow: hidden; }
  .output-toolbar { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 8px; overflow-x: auto; }
  .output-toolbar button {
    display: inline-grid; flex: 0 0 34px; width: 34px; height: 32px; place-items: center;
    padding: 0; border: 1px solid var(--surface-border); border-radius: 6px;
    background: var(--tool-tab); color: var(--surface-text-muted);
  }
  .output-toolbar button:hover, .output-toolbar button.active { border-color: var(--navy); background: var(--navy); color: #fff; }
  .output-toolbar svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .copy-status { align-self: center; color: var(--surface-text-muted); font-size: 11px; white-space: nowrap; }
  .output-view { flex: 1; min-height: 0; }
  .output-view.hidden { display: none; }
  #preview-frame { width: 100%; height: 100%; border: 1px solid var(--surface-border); border-radius: 8px; background: #fff; }
  #out-html { width: 100%; height: 100%; resize: none; border: 1px solid var(--surface-border); border-radius: 8px; background: #101722; color: #e8eef8; padding: 16px; font: 12px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace; }
  @media (max-width: 900px) {
    .document-page { display: block; height: auto; overflow: auto; }
    .editor-column { width: 100%; border-right: 0; border-bottom: 1px solid var(--surface-border); }
    .split-handle { display: none; }
    .output-panel { min-height: 74vh; }
  }
  @media (max-width: 520px) {
    .page-head, .form-panel, .output-panel { padding-left: 14px; padding-right: 14px; }
    .row2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body data-tool="document">
<div id="tool-workspace" class="document-page">
  <section class="editor-column" aria-labelledby="tool-title">
    <header class="page-head">
      <p class="eyebrow">DOCUMENT WORKSPACE</p>
      <h1 id="tool-title">文件表單</h1>
      <p class="hint">用分類區塊與表格建立 DGHM 工作清單、需求整理與專案文件。</p>
    </header>

    <div class="form-panel">
      <div class="form-head">
        <p class="hint">填寫文件資訊；各內容區塊右上角的「頁」欄位可決定內容落在第幾頁。</p>
      </div>

      <div class="draft-actions">
        <button type="button" class="secondary" id="load-draft-btn">
          <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8l6 6v12a2 2 0 0 1-2 2z"/><path d="M14 2v6h6M12 18v-6m0 0-3 3m3-3 3 3"/></svg>
          <span>載入草稿 JSON</span>
        </button>
        <button type="button" class="secondary" id="save-draft-btn">
          <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8l6 6v12a2 2 0 0 1-2 2z"/><path d="M14 2v6h6M12 12v6m0 0 3-3m-3 3-3-3"/></svg>
          <span>下載草稿 JSON</span>
        </button>
        <button type="button" class="secondary" id="clear-btn">
          <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 11v6M14 11v6M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          <span>清除本機暫存</span>
        </button>
        <span class="draft-status" id="draft-status" aria-live="polite"></span>
        <button type="button" class="secondary" id="accordion-toggle-all" aria-label="全部收合" title="全部收合">
          <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h8M3 12h8M3 19h8M15 5l3 3 3-3M15 19l3-3 3 3"/></svg>
        </button>
        <input type="file" id="load-draft-input" accept="application/json,.json" hidden>
      </div>

      <form id="document-form">
        <fieldset>
          <legend>01 — 文件欄位</legend>

          <label for="f_doc_title">文件標題
            <span class="field-note">顯示於成品右上角的橘底白字標籤。</span>
          </label>
          <input type="text" id="f_doc_title" autocomplete="off" placeholder="例如：專案說明書">

          <label for="f_main">文件主標題
            <span class="field-note">可輸入多行，例如「電商網站建置／最低限度可用版本」。</span>
          </label>
          <textarea id="f_main" rows="2" placeholder="文件的主要標題"></textarea>

          <label for="f_subtitle">副標題</label>
          <input type="text" id="f_subtitle" autocomplete="off" placeholder="簡短補充說明（選填）">

          <div class="row2">
            <div>
              <label for="f_doc_no">文件編號</label>
              <input type="text" id="f_doc_no" autocomplete="off" placeholder="留白">
            </div>
            <div>
              <label for="f_doc_purpose">文件用途</label>
              <input type="text" id="f_doc_purpose" autocomplete="off" placeholder="留白">
            </div>
          </div>

          <label for="f_footer_note">頁尾說明</label>
          <input type="text" id="f_footer_note" autocomplete="off" placeholder="例如：本文件僅供內部提案準備參考">
        </fieldset>

        <fieldset>
          <legend>02 — 內容區塊與表格</legend>
          <span class="field-note">每個區塊包含標題、說明及一張兩欄表格；「頁」可指定輸出位置。</span>
          <div id="section-list" class="section-list"></div>
          <button type="button" class="btn-add" id="add-section-btn">＋ 新增內容區塊</button>
        </fieldset>

        <fieldset>
          <legend>03 — 條件與補充說明</legend>
          <span class="field-note">參考報價單與應收帳款單的條款區塊；頁碼留白時會自動放在最後一頁。</span>
          <div class="row2">
            <div>
              <label for="f_terms_title">區塊標題</label>
              <input type="text" id="f_terms_title" value="條件說明">
            </div>
            <div>
              <label for="f_terms_page">指定頁碼（選填）</label>
              <input type="number" id="f_terms_page" min="1" placeholder="自動：最後一頁">
            </div>
          </div>
          <label>條件清單</label>
          <div id="terms-list"></div>
          <button type="button" class="btn-add small" id="add-term-btn">＋ 新增條件</button>
          <label for="f_terms_note">補充說明（選填，深藍左框提示）</label>
          <textarea id="f_terms_note" rows="3" placeholder="例如：如有未盡事宜，雙方另行協議。"></textarea>
        </fieldset>

      </form>
    </div>
  </section>

  <div class="split-handle" role="separator" aria-orientation="vertical" aria-label="拖曳調整預覽寬度" title="拖曳調整預覽寬度"></div>

  <section class="output-panel" aria-label="文件輸出">
    <div class="output-toolbar">
      <button type="button" class="tab-btn active" data-tab="preview" aria-label="即時預覽" title="即時預覽">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>
      </button>
      <button type="button" class="tab-btn" data-tab="html" aria-label="HTML 原始碼" title="HTML 原始碼">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 9-3 3 3 3M16 9l3 3-3 3M14 5l-4 14"/></svg>
      </button>
      <button type="button" id="copy-btn" aria-label="複製 HTML" title="複製 HTML">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
      </button>
      <button type="button" id="download-btn" aria-label="下載 HTML" title="下載 HTML">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14"/></svg>
      </button>
      <button type="button" id="open-btn" aria-label="開啟列印版" title="開啟列印版">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h5v5M10 14l9-9M19 14v5H5V5h5"/></svg>
      </button>
      <span class="copy-status" id="copy-status" aria-live="polite"></span>
    </div>
    <div class="output-view" id="view-preview"><iframe id="preview-frame" title="A4 文件即時預覽"></iframe></div>
    <div class="output-view hidden" id="view-html"><textarea id="out-html" readonly spellcheck="false" aria-label="HTML 原始碼"></textarea></div>
  </section>
</div>

<script src="tool-registry.js?v=20260923-1"></script>
<script src="project-context.js?v=20260903-3"></script>
<script src="app-shell.js?v=20260915-1"></script>

  function paintPreview(html) {

        doc.title = parsed.title;
        doc.head.innerHTML = parsed.head.innerHTML;
        doc.body.innerHTML = parsed.body.innerHTML;
        fitPreview();
        return;
      }
    } catch (error) {}
    frame.srcdoc = html.replace('<html', '<html data-preview-ready');
  }
  function fitPreview() {
    var frame = document.getElementById('preview-frame');

      var doc = frame.contentDocument;

      if (!page) return;
      doc.body.style.zoom = '1';
      doc.body.style.width = '100%';

      doc.body.style.zoom = String(scale);
    } catch (error) {}
  }

  function readDraft() {

  }
  function validateDraft(draft) {
    if (!draft || typeof draft !== 'object' || Array.isArray(draft)) throw new Error('草稿內容必須是物件');
    if (draft.kind && draft.kind !== 'dghm-document-draft') throw new Error('這不是文件表單草稿');
    if (!draft.fields || typeof draft.fields !== 'object' || Array.isArray(draft.fields)) throw new Error('草稿缺少 fields');
    fields.forEach(function (id) {
      if (id in draft.fields && typeof draft.fields[id] !== 'string') throw new Error(id + ' 必須是文字');
    });
    if (!Array.isArray(draft.sections)) throw new Error('草稿缺少 sections');
    draft.sections.forEach(function (section, sectionIndex) {
      if (!section || typeof section !== 'object' || Array.isArray(section)) throw new Error('區塊 ' + (sectionIndex + 1) + ' 格式錯誤');
      ['title', 'description', 'columnA', 'columnB'].forEach(function (key) {
        if (key in section && typeof section[key] !== 'string') throw new Error('區塊 ' + (sectionIndex + 1) + ' 的 ' + key + ' 必須是文字');
      });
      if ('page' in section && (!Number.isInteger(section.page) || section.page < 1)) throw new Error('區塊頁數必須是大於 0 的整數');
      if (!Array.isArray(section.rows)) throw new Error('區塊 ' + (sectionIndex + 1) + ' 缺少 rows');
      section.rows.forEach(function (row, rowIndex) {
        if (!row || typeof row !== 'object' || Array.isArray(row)) throw new Error('區塊 ' + (sectionIndex + 1) + ' 第 ' + (rowIndex + 1) + ' 列格式錯誤');
        if ('item' in row && typeof row.item !== 'string') throw new Error('表格項目必須是文字');
        if ('description' in row && typeof row.description !== 'string') throw new Error('表格說明必須是文字');
      });
    });
    if ('terms' in draft && !Array.isArray(draft.terms)) throw new Error('terms 必須是陣列');
    (draft.terms || []).forEach(function (term) {
      if (typeof term !== 'string') throw new Error('每項條件必須是文字');
    });
    return draft;
  }
  function applyDraft(draft) {
    validateDraft(draft);

    button.addEventListener('click', function () {
      document.querySelectorAll('.tab-btn').forEach(function (item) { item.classList.remove('active'); });
      document.querySelectorAll('.output-view').forEach(function (item) { item.classList.add('hidden'); });
      button.classList.add('active');
      document.getElementById('view-' + button.dataset.tab).classList.remove('hidden');
    });
  });
  document.getElementById('copy-btn').addEventListener('click', function () {
    var status = document.getElementById('copy-status');
    navigator.clipboard.writeText(flushRender()).then(function () {
      status.textContent = '已複製'; setTimeout(function () { status.textContent = ''; }, 1600);
    }).catch(function () { status.textContent = '無法複製，請切到原始碼手動複製'; });
  });
  document.getElementById('download-btn').addEventListener('click', function () {
    var blob = new Blob([flushRender()], { type: 'text/html;charset=utf-8' });
    var link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = safeFilename(value('f_doc_no') || value('f_doc_title')) + '.html';
    link.click(); setTimeout(function () { URL.revokeObjectURL(link.href); }, 1000);
  });
  document.getElementById('open-btn').addEventListener('click', openDocument);
  document.getElementById('preview-frame').addEventListener('load', fitPreview);
  if (window.ResizeObserver) new ResizeObserver(fitPreview).observe(document.getElementById('preview-frame'));

  if (document.modelContext && document.modelContext.registerTool) {
    document.modelContext.registerTool({
      name: 'stage_dghm_document', title: '填寫 DGHM 文件',
      description: '把標題、編號、用途、分類表格與結尾條件填入目前的 DGHM 文件表單產生器。',
      inputSchema: {
        type: 'object', additionalProperties: false,
        properties: {
          documentTitle: { type: 'string' }, documentNumber: { type: 'string' },
          purpose: { type: 'string' }, mainTitle: { type: 'string' },
          subtitle: { type: 'string' }, footerNote: { type: 'string' },
          termsTitle: { type: 'string' }, termsPage: { type: 'integer', minimum: 1 },
          termsNote: { type: 'string' }, terms: { type: 'array', items: { type: 'string' } },
          sections: {
            type: 'array', items: {
              type: 'object', additionalProperties: false,
              properties: {
                title: { type: 'string' }, description: { type: 'string' }, page: { type: 'integer', minimum: 1 },
                columnA: { type: 'string' }, columnB: { type: 'string' },
                rows: { type: 'array', items: { type: 'object', additionalProperties: false, properties: {
                  item: { type: 'string' }, description: { type: 'string' }
                } } }
              }
            }
          }
        }
      },
      annotations: { readOnlyHint: false, untrustedContentHint: false },
      execute: function (input) {
        input = input || {};
        if (typeof input !== 'object' || Array.isArray(input)) throw new Error('輸入格式必須是物件');
        var mapping = {
          documentTitle: 'f_doc_title', documentNumber: 'f_doc_no', purpose: 'f_doc_purpose',
          mainTitle: 'f_main', subtitle: 'f_subtitle', footerNote: 'f_footer_note',
          termsTitle: 'f_terms_title', termsNote: 'f_terms_note'
        };
        Object.keys(mapping).forEach(function (key) {
          if (key in input) {
            if (typeof input[key] !== 'string') throw new Error(key + ' 必須是字串');
            document.getElementById(mapping[key]).value = input[key];
          }
        });
        if ('termsPage' in input) {
          if (!Number.isInteger(input.termsPage) || input.termsPage < 1) throw new Error('termsPage 必須是大於 0 的整數');
          document.getElementById('f_terms_page').value = String(input.termsPage);
        }
        if ('terms' in input) {
          if (!Array.isArray(input.terms) || input.terms.some(function (term) { return typeof term !== 'string'; })) throw new Error('terms 必須是文字陣列');
          document.getElementById('terms-list').innerHTML = '';
          if (input.terms.length) input.terms.forEach(function (term) { addTerm(term); });
          else addTerm('');
        }
        if ('sections' in input) {
          if (!Array.isArray(input.sections)) throw new Error('sections 必須是陣列');
          document.getElementById('section-list').innerHTML = '';
          sectionSeq = 0;
          input.sections.forEach(function (section) {
            if (!section || typeof section !== 'object' || Array.isArray(section)) throw new Error('每個 section 必須是物件');
            ['title', 'description', 'columnA', 'columnB'].forEach(function (key) {
              if (key in section && typeof section[key] !== 'string') throw new Error('section.' + key + ' 必須是字串');
            });
            if ('page' in section && (!Number.isInteger(section.page) || section.page < 1)) throw new Error('section.page 必須是大於 0 的整數');
            if ('rows' in section && !Array.isArray(section.rows)) throw new Error('section.rows 必須是陣列');
            (section.rows || []).forEach(function (row) {
              if (!row || typeof row !== 'object' || Array.isArray(row)) throw new Error('每個 row 必須是物件');
              if ('item' in row && typeof row.item !== 'string') throw new Error('row.item 必須是字串');
              if ('description' in row && typeof row.description !== 'string') throw new Error('row.description 必須是字串');
            });
            addSection(section);
          });
          if (!input.sections.length) addSection({ page: 1, rows: [{}] });
        }
        saveDraft(); render();
        return {
          status: 'staged',
          fieldsUpdated: Object.keys(mapping).filter(function (key) { return key in input; }),
          sectionsUpdated: 'sections' in input ? input.sections.length : 0,
          termsUpdated: 'terms' in input ? input.terms.length : 0
        };
      }
    });
  }

  initFormAccordions();
  if (!restoreDraft(false)) {
    addSection({ page: 1, rows: [{}] });
    addTerm('');
  }
  render();
})();
</script>
</body>
</html>
